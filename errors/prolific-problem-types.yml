envelope:
  schema: Error
  shape: '{ "error": { "status": int, "error_code": int, "title": string, "detail": object|string, "additional_information": string } }'
  notes: >-
    Prolific returns a wrapped error object (not RFC 9457 application/problem+json). `status`
