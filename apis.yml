aid: prolific
name: Prolific
description: >-
  Prolific is a platform for high-quality human data collection, connecting researchers and
  AI/ML teams with a vetted pool of verified participants for online studies, surveys, and
  human-feedback tasks (preference tuning, safety evals, benchmarks, RLHF). Its public REST API
  (api.prolific.com, OpenAPI 3.1) automates the full workflow: create and cost studies, target
  participants with demographic filters and filter sets, launch and monitor recruitment, review
  and approve submissions, pay rewards and bonuses, message participants, run AI Task Builder
  batches, and receive HMAC-signed webhooks. Prolific also ships a Go CLI and an official
  Model Context Protocol server for agent-driven study workflows. Trusted by Google, Hugging Face,
  and academic and government researchers.
