  /api/v1/data-collection/collections/{collection_id}/export:
    post:
      operationId: request-collection-export
      summary: Request a Collection Export
      description: >-
        Initiates an asynchronous export of all participant responses and uploaded files for a collection as a ZIP
        archive.


        The export is generated out-of-band to handle large collections without hitting API timeout limits. The endpoint
        returns immediately with one of two outcomes:


        - **202 Accepted** — a new export job has been enqueued. Use the returned `export_id` to poll `GET
        /collections/{collection_id}/export/{export_id}` for status.

        - **200 OK** — a recent export already exists and is ready to download immediately.


        Subsequent POST requests for the same collection are idempotent while an export is generating or complete; they
        return the existing job ID or download URL rather than re-triggering generation.


        Only researchers with workspace access to the collection can request an export.
      tags:
        - aiTaskBuilder
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Export already complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionExportComplete'
        '403':
          description: Forbidden — user does not have workspace access to this collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/data-collection/collections/{collection_id}/export/{export_id}:
    get:
      operationId: get-collection-export-status
      summary: Get Collection Export Status
      description: >-
        Polls the status of an asynchronous collection export job initiated by `POST
        /collections/{collection_id}/export`.


        Returns the current status of the export:


        - **generating** — the export is still being built; continue polling.

        - **complete** — the export is ready; a presigned HTTPS download URL is included. URLs are valid for 1 hour and
        are automatically refreshed if expired.

        - **failed** — generation failed (e.g. the archive was deleted from storage). Re-send `POST
        /collections/{collection_id}/export` to retry.
      tags:
        - aiTaskBuilder
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
        - name: export_id
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Export status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionExportStatus'
        '404':
          description: Export job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
