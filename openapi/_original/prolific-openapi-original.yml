  /api/v1/studies/{id}/transition/:
    post:
      operationId: publish-study
      summary: Transition a study's status
      description: >-
        Transition a study between statuses using one of the available actions.


        The following transitions are available:


        | Current Status | Action | Resulting Status |

        |---|---|---|

        | UNPUBLISHED | PUBLISH | ACTIVE |

        | UNPUBLISHED | SCHEDULE_PUBLISH | SCHEDULED |

        | SCHEDULED | CANCEL_PUBLISH | UNPUBLISHED |

        | ACTIVE | PAUSE | PAUSED |

        | ACTIVE | STOP | COMPLETED |

        | PAUSED | START | ACTIVE |

        | PAUSED | STOP | COMPLETED |


        **Action details:**

        - **PUBLISH**: Publish a draft study so participants can take part. The study must be fully configured.

        - **SCHEDULE_PUBLISH**: Schedule a draft study to be published at a future time. A `publish_at` field (ISO 8601
        datetime) must be set either on the study or provided in this request.

        - **CANCEL_PUBLISH**: Cancel a scheduled publication, returning the study to draft.

        - **PAUSE**: Temporarily pause an active study. Participants already taking part can still complete, but no new
        participants will be recruited.

        - **START**: Resume a paused study.

        - **STOP**: Stop a study completely. To make it active again you will need to increase the number of places.


        To learn more about it check out [help
        center](https://researcher-help.prolific.com/en/articles/445200-pausing-stopping-a-study)
      tags:
        - studies
      parameters:
        - name: id
          in: path
          description: Study id
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyTransition'
