      type: string
      enum:
        - participant
        - researcher
      default: participant
      description: The actor that can provide this completion code.
      title: BaseStudyCompletionCodesItemsActor
    BaseStudyCompletionCodesItems:
      type: object
      properties:
        code:
          type:
            - string
            - 'null'
          description: >
            The code the participant will either enter manually at the end of your study or be redirected as part of the
            return URL.


            If the code is null, then the participant will not be asked to submit a completion code when they return to
            Prolific.

            Null codes can only be provided when:
              - The actor is "participant"
              - There are no other completion codes with the "participant" actor
              - The actions array is empty

            The code must be unique within the study.
        code_type:
          $ref: '#/components/schemas/BaseStudyCompletionCodesItemsCodeType'
          description: >
            A name for your code to make it easier to understand its intention. Either use one of the predefined options
            or any other free text.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudyCompletionCodesItemsActionsItems'
          description: >-
            The actions that will be completed automatically when the submission is completed with this code by the
            participant.


            You have the ability to use one or multiple `actions` together - it's up to you and your desired automated
            journey.


            If you’re looking to keep things simple, we recommend setting the `{"action": "MANUALLY_REVIEW"}` option
            only, so all submissions wait for your manual approval.
        actor:
          $ref: '#/components/schemas/BaseStudyCompletionCodesItemsActor'
          default: participant
          description: The actor that can provide this completion code.
      required:
        - code
        - code_type
        - actions
      title: BaseStudyCompletionCodesItems
    BaseStudyDeviceCompatibilityItems:
      type: string
      enum:
        - desktop
        - tablet
        - mobile
      title: BaseStudyDeviceCompatibilityItems
    BaseStudyPeripheralRequirementsItems:
      type: string
      enum:
        - audio
        - camera
        - download
        - microphone
      title: BaseStudyPeripheralRequirementsItems
    BaseStudyFiltersItems:
      oneOf:
        - $ref: '#/components/schemas/SelectFilter'
        - $ref: '#/components/schemas/RangeFilter'
        - $ref: '#/components/schemas/CompositeFilter'
      title: BaseStudyFiltersItems
    BaseStudySubmissionsConfigAutoRejectionCategoriesItems:
      type: string
      enum:
        - EXCEPTIONALLY_FAST
      title: BaseStudySubmissionsConfigAutoRejectionCategoriesItems
    BaseStudySubmissionsConfig:
      type: object
      properties:
        max_submissions_per_participant:
          type:
            - integer
            - 'null'
          default: 1
          description: >-
            - **1** is the default Prolific experience. This means one submission, per participant, per study. If you do
              not specify this field, the **default is 1**.
            - **1+** turns your study into a multi-submission study, meaning a participant can create many submissions
            per study.
              As noted above, your survey system will need to handle providing a
            unique experience each time the participant takes the study.

            - **-1** will allow an indefinite number of submissions from a single participant, up to
            `total_available_places`.
        max_concurrent_submissions:
          type:
            - integer
            - 'null'
          default: -1
          description: |-
            - **-1** is the default value, meaning unlimited concurrent active/reserved submissions per study.
            - **1+** limits the number of concurrent active/reserved submissions a study can have at one time.
        auto_rejection_categories:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudySubmissionsConfigAutoRejectionCategoriesItems'
          default: []
          description: >-
            List of rejection categories that trigger automatic submission rejections.


            **Available Categories:**

            - **EXCEPTIONALLY_FAST**: Automatically reject submissions completed in an exceptionally short time


            **Important Notes:**

            - **This feature is currently in an evaluation period and can be activated for your workspace upon
            request.**

            - Auto-rejections only apply to submissions in "AWAITING REVIEW" status

            - Submissions with return requests will not be auto-rejected

            - Auto-rejected submissions do not count towards your rejection limit

            - Set to an empty array `[]` or omit this field to disable auto-rejection
      description: >-
        **Advanced**: This helps with faster data collection. Your survey system will need to handle providing a

        unique experience each time the participant takes the study.


        Configuration related to study submissions. The purpose of this field is to capture any configuration options
        that impact the submissions made by participants in a study.
      title: BaseStudySubmissionsConfig
    BaseStudyStudyLabelsItems:
      type: string
      enum:
        - survey
        - writing_task
        - annotation
        - decision_making_task
        - interview
        - other
        - ai_annotation
        - ai_evaluation
        - ai_reasoning
        - ai_fact_checking
        - ai_safety
        - ai_data_creation_text
        - ai_data_creation_audio
        - ai_data_creation_video
        - ai_data_creation_images
        - ai_other
      title: BaseStudyStudyLabelsItems
    BaseStudyContentWarningsItems:
      type: string
      enum:
        - sensitive
        - explicit
      title: BaseStudyContentWarningsItems
    BaseStudyDataCollectionMethod:
      type: string
      enum:
        - AI_TASK_BUILDER_BATCH
        - AI_TASK_BUILDER_COLLECTION
      description: >-
        **Optional.** Specifies the data collection method for the study.


        - `AI_TASK_BUILDER_BATCH`: Use AI Task Builder for data annotation tasks.

        - `AI_TASK_BUILDER_COLLECTION`: Use AI Task Builder for data collection tasks.


        **Note:** This field is mutually exclusive with `external_study_url` and `access_details`. If not provided, you
        must specify one of those fields instead.
      title: BaseStudyDataCollectionMethod
    BaseStudyDataCollectionMetadata:
      type: object
      properties:
        annotators_per_task:
          type: integer
          description: >-
            Number of annotators required per task. Required for AI Task Builder Batch studies to set multiple
            annotators.
      description: >-
        **Optional.** Additional metadata for configuring AI Task Builder data annotation behavior. Only used when
        `data_collection_method` is set to `AI_TASK_BUILDER_BATCH`.


        **Properties:**


        - `annotators_per_task` (integer): Number of annotators per task. **This field must be provided if you want
        multiple annotators per task.** Without this field, the default value of 1 will be used.
          - Minimum: 1
          - Default: 1 (if not provided)

        **Example:**

        ```json

        {
          "annotators_per_task": 5
        }

        ```


        **Important:** You must include `annotators_per_task` to control how many participants annotate each task. After
        the study is published, this value can only be increased (not decreased), which will increase the total
        available places on the study.
      title: BaseStudyDataCollectionMetadata
    BaseStudyAccessDetailsItems:
      oneOf:
        - $ref: '#/components/schemas/AccessDetail'
      title: BaseStudyAccessDetailsItems
    BaseStudy:
      type: object
      properties:
        name:
          type: string
          description: Public name or title of the study
        internal_name:
          type:
            - string
            - 'null'
          description: Internal name of the study, not shown to participants
        description:
          type: string
          description: >-
            Description of the study for the participants to read before

            starting the study


            **Supported HTML in `description`**


            The `description` field supports the following HTML tags for formatting participant instructions:


            * `<b>` - bold

            * `<i>` - italic

            * `<em>` - emphasized text

            * `<strong>` - strong importance

            * `<s>` - strikethrough

            * `<u>` - underline

            * `<h1>` - heading level 1

            * `<h2>` - heading level 2

            * `<ol>` - ordered list

            * `<ul>` - unordered list

            * `<li>` - list item

            * `<p>` - paragraph


            Other HTML tags will be stripped or escaped. Please ensure that you only use supported tags for formatting
            to avoid rendering issues.
        external_study_url:
          type: string
          description: >-
            URL of the survey or experiment you want participant to access. You can pass URL search parameters to your
            survey or experiment


            * Participant id {{%PROLIFIC_PID%}}

            * Study id {{%STUDY_ID%}}

            * Session id {{%SESSION_ID%}}


            For example `https://eggs-experriment.com?participant={{%PROLIFIC_PID%}}`
        prolific_id_option:
          $ref: '#/components/schemas/BaseStudyProlificIdOption'
          description: >-
            Use 'question' if you will add a question in your survey or experiment asking the participant ID


            **Recommended** Use 'url_parameters' if your survey or experiment can retrieve and store those parameters
            for your analysis.


            Use 'not_required' if you don't need to record them.
        completion_codes:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudyCompletionCodesItems'
          description: >-
            Specify at least one completion code for your study. A participant will enter one of these codes when they
            complete your study.


            Each code must be unique within a study.


            You can specify as many actions as you like per code. However, some actions can't be used together (e.g.
            AutomaticallyApprove and ManuallyReview).


            **Note:** This field is optional when `data_collection_method` is set to `AI_TASK_BUILDER_BATCH` or
            `AI_TASK_BUILDER_COLLECTION`. When omitted, a default COMPLETED code with a `MANUALLY_REVIEW` action is
            auto-generated. When provided, AITB studies must include exactly one code with `code_type` of `COMPLETED`
            and an action of `MANUALLY_REVIEW` or `AUTOMATICALLY_APPROVE`.
        total_available_places:
          type: number
          format: double
          description: >-
            How many participants are you looking to recruit.


            **Note:** This field is optional when `data_collection_method` is set to `AI_TASK_BUILDER_BATCH`, as the
            total available places are automatically calculated from the batch configuration.
        estimated_completion_time:
          type: number
          format: double
          description: Estimated duration in minutes of the experiment or survey
        maximum_allowed_time:
          type: number
          format: double
          description: >-
            Max time in minutes for a participant to finish the submission. Submissions are timed out if it takes
            longer.


            If it is not provided the default value is set to the max value.


            The min value is calculated as two minutes plus two times the estimated time plus two times the square root
            of the estimated time
        reward:
          type: number
          format: double
          description: |-
            How much are you going to pay the participants in cents. We
            use the currency of your account.
        device_compatibility:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudyDeviceCompatibilityItems'
          description: |-
            Add all devices that participants can use.
            You can include one or more options.

            An empty array indicates that all options are available.
        peripheral_requirements:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudyPeripheralRequirementsItems'
          description: |-
            Add all requirements that participants have to meet.

            An empty array indicates that there are no extra peripheral requirements.
        filters:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/BaseStudyFiltersItems'
          description: >-
            Array of filters.


            For advanced participant targeting with `and` / `or` groups, see [Advanced
            filtering](/api-reference/filters/advanced-filtering).


            Use empty array for "Everyone"
        filter_set_id:
          type:
            - string
            - 'null'
          description: |-
            The ID of a filter set, from which filters for the study will be taken.

            For more information, see [Filter Sets](/api-reference/filter-sets).

            Note, this cannot be used in combination with additional filters via the `filters` field.
        filter_set_version:
          type:
            - integer
            - 'null'
          description: |-
            The version of the filter set to be used.

            If not provided, this will default to the latest available version at the time of applying the filter set.
        naivety_distribution_rate:
          type:
            - number
            - 'null'
          format: double
          description: |-
            Control the balance between speed of your studies and the naivety of the participants.

            If not defined, by default Prolific calculates the best rate for most studies
            taking into account the `filters` and the `total_available_places` needed for this study.

            Use 0 if your priority is speed. When this property is set to 0 all eligible participants will have access
            to your study at the same time, without any prioritization.

            You can also set this at a workspace and project level.
        project:
          type: string
          description: >-
            Project ID. When you don't specify a project in your request, Prolific automatically uses your first created
            project as the default. For clarity, we recommend explicitly including the project ID in your requests.
        submissions_config:
          $ref: '#/components/schemas/BaseStudySubmissionsConfig'
          description: >-
            **Advanced**: This helps with faster data collection. Your survey system will need to handle providing a

            unique experience each time the participant takes the study.


            Configuration related to study submissions. The purpose of this field is to capture any configuration
            options that impact the submissions made by participants in a study.
        study_labels:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudyStudyLabelsItems'
          description: >-
            This field allows you to tag studies with information about the type/topic of the study and the kind of work
            involved in completing it.


            We plan to make this information available to participants for easier self-selection. At present these
            options are mutually exclusive and only a single option can be selected, however in the future available
            categories will expand.
        content_warnings:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudyContentWarningsItems'
          description: >-
            Allow researchers to define content warnings for their study.


            At present these options are mutually exclusive and only a single option can be selected, however in the
            future available warnings will expand.
        content_warning_details:
          type: string
          description: Allow researchers to add further details about their content warning.
        metadata:
          type:
            - string
            - 'null'
          description: |-
            This field can be used to store extra information required for a system integration.
            For example, it could be some JSON, XML, an integer, or a string.

            Examples could include:

              - `123345` - An ID from your system, that helps with linkage when returning the study.
              - `{ \"id\": \"45\", \"type\": \"finance\"}` - Some JSON that you want to store.
        credential_pool_id:
          type:
            - string
            - 'null'
          description: |-
            The ID of the credential pool to associate with this study. Credential pools contain
            username/password pairs that are distributed to participants when they start the study.

            When provided, participants will be assigned unique credentials from the pool. Each
            credential can only be used once and is tracked throughout the study lifecycle.

            **Note:** The credential pool must:
            - Exist and belong to the study's workspace
            - Have available (unredeemed) credentials

            See the [Credentials endpoints](#tag/Credentials) for managing credential pools.
        has_credentials:
          type: boolean
          description: |-
            Indicates whether this study requires participants to use credentials. This field is
            automatically set to `true` when a `credential_pool_id` is provided, and `false` when
            the credential pool is removed.

            **Note:** This field is automatically managed based on the `credential_pool_id` field
            and does not need to be set manually.
        data_collection_method:
          oneOf:
            - $ref: '#/components/schemas/BaseStudyDataCollectionMethod'
            - type: 'null'
          description: >-
            **Optional.** Specifies the data collection method for the study.


            - `AI_TASK_BUILDER_BATCH`: Use AI Task Builder for data annotation tasks.

            - `AI_TASK_BUILDER_COLLECTION`: Use AI Task Builder for data collection tasks.


            **Note:** This field is mutually exclusive with `external_study_url` and `access_details`. If not provided,
            you must specify one of those fields instead.
        data_collection_id:
          type:
            - string
            - 'null'
          description: >-
            The ID of the data collection batch or project from the Task Builder API.


            **Required when `data_collection_method` is set to `AI_TASK_BUILDER_BATCH` or
            `AI_TASK_BUILDER_COLLECTION`.**
        data_collection_metadata:
          oneOf:
            - $ref: '#/components/schemas/BaseStudyDataCollectionMetadata'
            - type: 'null'
          description: >-
            **Optional.** Additional metadata for configuring AI Task Builder data annotation behavior. Only used when
            `data_collection_method` is set to `AI_TASK_BUILDER_BATCH`.


            **Properties:**


            - `annotators_per_task` (integer): Number of annotators per task. **This field must be provided if you want
            multiple annotators per task.** Without this field, the default value of 1 will be used.
              - Minimum: 1
              - Default: 1 (if not provided)

            **Example:**

            ```json

            {
              "annotators_per_task": 5
            }

            ```


            **Important:** You must include `annotators_per_task` to control how many participants annotate each task.
            After the study is published, this value can only be increased (not decreased), which will increase the
            total available places on the study.
        access_details:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/BaseStudyAccessDetailsItems'
          description: >-
            Array of access_details, which integrates with taskflow.


            While this field is nullable, you must provide one of `access_details` or `external_study_url`.


            The sum of all access_details must add to the `total_available_places` field, however the values can be
            different for an individual access_detail.
        is_external_study_url_secure:
          type: boolean
          description: >-
            When set to true, any query parameters in the external study url will be signed with a JSON Web Token. The
            token will be added to the URL as a query parameter named `prolific_token`.


            This feature is only available to certain workspaces.


            **The JWT payload**


            Header:


            ```json

            {
              "alg": "RS256",
              "kid": "<KEY_ID>",
              "typ": "JWT"
            }

            ```


            Where

            - alg is always RS256.

            - kid indicates the key ID that was used to secure the JWT.

            - typ is always JWT.


            Payload:


            ```json

            {
              "iss": "https://www.prolific.com",
              "iat": <CURRENT_TIME>,
              "exp": <CURRENT_TIME + 2 minutes>,
              "aud": "<EXTERNAL_STUDY_URL>",
              "sub": "<SESSION_ID>",
              "prolific":{
                "<QUERY_1>": "<VALUE_1>",
                "<QUERY_2>": "<VALUE_2>",
                ...
                "workspace_id": "<WORKSPACE_ID>",
                "organisation_id": "<ORGANISATION_ID>"
              }
            }

            ```


            `<ORGANISATION_ID>` appears only when the workspace is linked to an

            organisation; otherwise omit that key from `prolific`.


            The `prolific` object maps each URL parameter from your

            external study URL template to the resolved value for that

            placeholder (for example participant, study, and session

            identifiers). Prolific always adds `workspace_id` (string). When the

            workspace is linked to an organisation, `organisation_id` (string)

            is also present.


            For example (the sample below includes `organisation_id`; that key

            is omitted when the workspace has no linked organisation):


            ```json

            {
              "iss": "https://www.prolific.com",
              "iat": 1740496135,
              "exp": 1740496255,
              "aud": "https://x.com?STUDY_ID=1&...",
              "sub": "1234",
              "prolific":{
                "STUDY_ID": "abcd",
                "SESSION_ID": "1234",
                "PROLIFIC_PID": "xyz",
                "workspace_id": "507f1f77bcf86cd799439011",
                "organisation_id": "507f191e810c19729de860ea"
              }
            }

            ```


            **Verify the payload**


            When you receive the JWT, you must verify the following:

            - The JWT signature is authentic by verifying it with the public key from Prolific that correlates with the
            KID. The public keys can be retrieved from
            [/.well-known/study/jwks.json](#tag/Well-Known-Endpoints/paths/~1.well-known~1study~1jwks.json/get).

            - The JWT hasn't expired, by checking the `exp` claim.

            - The `aud` claim is the correct domain for your tool.

            - The `prolific` claim matches your expected payload as set in the `external_study_url` property. It always
            includes `workspace_id`. When the workspace is linked to an organisation, it also includes `organisation_id`
            (validate both against what your integration expects).
      title: BaseStudy
    StudyTransitionAction:
      type: string
      enum:
        - PUBLISH
        - SCHEDULE_PUBLISH
        - CANCEL_PUBLISH
        - PAUSE
        - START
        - STOP
      description: The transition action to execute on the study.
      title: StudyTransitionAction
    StudyTransition:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/StudyTransitionAction'
          description: The transition action to execute on the study.
        publish_at:
          type: string
          format: date-time
          description: >-
            ISO 8601 datetime for when the study should be published. Required in the request when action is
            SCHEDULE_PUBLISH and the study does not already have a publish_at set.
      required:
        - action
      title: StudyTransition
    TestStudySetUpResponse:
      type: object
      properties:
        study_id:
          type: string
          format: objectId
          description: The ID of the study that was created for the test.
        study_url:
          type: string
          format: uri
          description: The URL of the study that was created for the test.
      title: TestStudySetUpResponse
    AccessDetailProgress:
      type: object
      properties:
        external_url:
          type: string
          description: >-
            URL of the task you want to send the participant to. You can pass URL search parameters as in
            `external_study_url`.
        total_allocation:
          type: number
          format: double
          description: >-
            The base number of places set by the researcher for this URL. This is the value used to determine the
            study's total available places and will match what was submitted when creating or updating the study.


            This value does not include screenout-driven capacity. For studies with custom screening (fixed screen-out
            reward), `allocated` may exceed `total_allocation` — use `capacity_increments` to understand why.
        allocated:
          type: number
          format: double
          description: >-
            The number of participants currently allocated to this URL.


            For studies with custom screening (fixed screen-out reward), this value may exceed `total_allocation`. This
            occurs when participants have been screened out — each screenout adds 1 to `capacity_increments`, allowing a
            replacement participant to be allocated. The relationship is always: `allocated ≤ total_allocation +
            capacity_increments`.
        capacity_increments:
          type: number
          format: double
          description: >-
            The cumulative number of additional capacity slots added to this URL by screenout events. Each time a
            participant is screened out, this value increases by 1, allowing a replacement participant to be allocated
            in their place.


            This field is read-only and system-managed — it cannot be set when creating or updating a study. It will be
            absent (or 0) for URLs where no screenouts have occurred.


            **Example:** If `total_allocation` is 10, `capacity_increments` is 3, and `allocated` is 11, it means 3
            participants were screened out, creating 3 extra slots, and 11 participants have been allocated in total — 2
            slots remain.
      required:
        - external_url
        - total_allocation
      title: AccessDetailProgress
    StudyAccessDetailsProgress:
      type: object
      properties:
        id:
          type: string
          description: The access details collection ID for this study's Taskflow configuration.
        progress:
          type: array
          items:
            $ref: '#/components/schemas/AccessDetailProgress'
          description: One row per `external_url` configured on the study.
        _links:
          type: object
          additionalProperties:
            description: Any type
          description: HAL-style links; typically includes `self` pointing at this endpoint.
      required:
        - id
        - progress
      title: StudyAccessDetailsProgress
    AmountAndCurrency:
      type: object
      properties:
        amount:
          type: number
          format: double
          description: Amount in subcurrency. £1 will return 100
        currency:
          type: string
          description: Currency Code
      title: AmountAndCurrency
    StudyCostBreakdown:
