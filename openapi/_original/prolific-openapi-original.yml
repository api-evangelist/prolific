          in: query
          description: The unique identifier of the workspace
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AI Task Builder_GetTaskBuilderBatches_Response_200'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: create-task-builder-batch
      summary: Create a Batch
      description: >-
        Create a new AI Task Builder batch. The dataset does not need to be in READY status at creation time.


        ### Configurable task layouts via `batch_items`


        You can configure a custom task layout using `batch_items` which also stores instructions and content as part of
        batch creation. It replaces the deprecated `POST /api/v1/data-collection/batches/{batch_id}/instructions`
        endpoint, which will reject requests on batches that were created with `batch_items`.


        `batch_items` is a nested layout describing what is shown to participants:


        - `batch_items` is an ordered array of **pages**. Each page is shown to participants as a single screen.

        - Each page has an ordered array of **rows**.

        - Each row has 1 or 2 **columns** rendered side-by-side.

        - Each column has one or more **items** — a dataset field reference, a content block (`image`, `rich_text`), or
        an instruction (`free_text`, `free_text_with_unit`, `multiple_choice`, `multiple_choice_with_free_text`,
        `file_upload`).


        Items are a discriminated union on `type`. Each `dataset_field` item references a field in the attached dataset
        by name — only fields with type `text` or `image_url` are permitted, and the same field may not be referenced
        more than once on the same page.


        On a successful response, every item in `batch_items` is returned with a server-assigned `id`.


        If `batch_items` fails server-side validation (for example: a `dataset_field` item used when no v4 dataset with
        a populated schema is attached, an unknown `dataset_field`, the same `dataset_field` referenced more than once
        on a page, an `answer_limit` larger than the number of options, or a `default_unit` that does not match the
        supplied `unit_options`), the request fails with **`422 Unprocessable Entity`** and an `INVALID_BATCH_ITEMS`
        payload containing per-item `page` / `row` / `column` / `item` locations. See the `BatchItemsValidationError`
        schema for the full shape.
      tags:
        - aiTaskBuilder
      parameters:
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AITaskBuilderBatchCreate'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity — `batch_items` failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchItemsValidationError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the batch
                workspace_id:
                  type: string
                  description: The ID of the Prolific workspace
                dataset_id:
                  type: string
                  format: uuid
                  description: The ID of the dataset to attach (optional at creation time)
                task_details:
                  $ref: >-
                    #/components/schemas/ApiV1DataCollectionBatchesPostRequestBodyContentApplicationJsonSchemaTaskDetails
                  description: Task metadata displayed to participants
                batch_items:
                  type:
                    - array
                    - 'null'
                  items:
                    $ref: '#/components/schemas/BatchItemsPage'
                  description: |-
                    Inline pages of instructions and content shown to participants. Each entry is a page
                    containing rows of columns of items (dataset field references, content blocks, or
                    instructions). When supplied, this is the recommended way to author instructions —
                    the legacy `POST /batches/{batch_id}/instructions` endpoint is rejected for batches
                    created with `batch_items`.
              required:
                - name
                - workspace_id
                - task_details
