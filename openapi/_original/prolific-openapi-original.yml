          $ref: '#/components/schemas/CreateStudySubmissionsConfig'
          description: >-
            **Advanced**: This helps with faster data collection. Your survey system will need to handle providing a

            unique experience each time the participant takes the study.


            Configuration related to study submissions. The purpose of this field is to capture any configuration
            options that impact the submissions made by participants in a study.
