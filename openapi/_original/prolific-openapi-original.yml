    DatasetSchemaFieldType:
      type: string
      enum:
        - text
        - image_url
        - metadata
        - task_group_id
      description: >-
        Field type:

        - `text` — a text value shown to participants. Can be referenced by `dataset_field` items in `batch_items`.

        - `image_url` — a URL pointing to an image shown to participants. Can be referenced by `dataset_field` items in
        `batch_items`.

        - `metadata` — an internal value included in exports but not shown to participants (equivalent to the `META_`
        prefix in V3 CSV datasets).

        - `task_group_id` — groups datapoints into task groups. Rows with the same `task_group_id` value are assigned to
        the same participant. Equivalent to `META_TASK_GROUP_ID` in V3 CSV datasets. At most one field per schema may
        have this type.
      title: DatasetSchemaFieldType
    DatasetSchemaField:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/DatasetSchemaFieldType'
          description: >-
            Field type:

            - `text` — a text value shown to participants. Can be referenced by `dataset_field` items in `batch_items`.

            - `image_url` — a URL pointing to an image shown to participants. Can be referenced by `dataset_field` items
            in `batch_items`.

            - `metadata` — an internal value included in exports but not shown to participants (equivalent to the
            `META_` prefix in V3 CSV datasets).

            - `task_group_id` — groups datapoints into task groups. Rows with the same `task_group_id` value are
            assigned to the same participant. Equivalent to `META_TASK_GROUP_ID` in V3 CSV datasets. At most one field
            per schema may have this type.
        label:
          type: string
          description: Optional human-readable label for the field, used in the participant interface.
      required:
        - type
      description: Descriptor for a single field in a dataset schema.
      title: DatasetSchemaField
    DatasetSchema:
      type: object
      properties:
        strict:
          type: boolean
          description: >-
            When `true`, records that are missing any field defined in the schema are rejected during import. When
            `false`, missing fields are allowed and treated as absent.
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DatasetSchemaField'
          description: >-
            A map of field key to field descriptor. The key is used to reference the field in `batch_items`
            (`dataset_field` items) and in JSONL records.
      required:
        - strict
        - fields
      description: >-
        A researcher-defined schema that specifies the fields in a V4 dataset. Each field has a type that determines how
        it is rendered to participants and how it can be referenced in `batch_items`.


        Constraints:

        - Maximum 200 fields per schema.

        - Field keys: 1–128 characters.

        - Field labels: maximum 255 characters.
      title: DatasetSchema
    AiTaskBuilderDatasetSchemaVersion:
      type: string
      enum:
        - '3'
        - '4'
      description: Internal dataset version. 3 = legacy CSV/ZIP; 4 = structured schema with JSONL/CSV import tracking.
      title: AiTaskBuilderDatasetSchemaVersion
    AiTaskBuilderDatasetStatus:
      type: string
      enum:
        - ERROR
        - PROCESSING
        - READY
        - UNINITIALISED
      description: Processing status. **V3 datasets only.** V4 datasets track status per import job via `imports`.
      title: AiTaskBuilderDatasetStatus
    DatasetImportJobType:
      type: string
      enum:
        - file_upload
      description: The type of import. Currently always `file_upload`.
      title: DatasetImportJobType
    DatasetImportJobStatus:
      type: string
      enum:
        - uninitialised
        - queued
        - processing
        - complete
        - partial
        - failed
        - pending_schema
      description: Current status of the import job.
      title: DatasetImportJobStatus
    ImportJobError:
      type: object
      properties:
        record_index:
          type:
            - integer
            - 'null'
          description: Zero-based index of the rejected record in the uploaded file.
        field:
          type:
            - string
            - 'null'
          description: >-
            The schema field key that caused the rejection, or `null` if no specific field is implicated.

            The special value `_raw` indicates a whole-record parse failure (e.g. malformed JSON) rather than a
            field-level error.
        reason:
          type:
            - string
            - 'null'
          description: Human-readable description of why the record was rejected.
      description: A record-level validation error from a partial import.
      title: ImportJobError
    DatasetImportJob:
      type: object
      properties:
        dataset_id:
          type: string
          format: uuid
          description: The dataset this import job belongs to.
        import_id:
          type: string
          format: uuid
          description: The unique identifier of the import job.
        type:
          $ref: '#/components/schemas/DatasetImportJobType'
          description: The type of import. Currently always `file_upload`.
        filename:
          type:
            - string
            - 'null'
          description: The original filename supplied when the upload URL was requested.
        created_at:
          type: string
          format: date-time
          description: When the import job was created (ISO 8601, UTC).
        updated_at:
          type: string
          format: date-time
          description: When the import job was last updated (ISO 8601, UTC).
        status:
          $ref: '#/components/schemas/DatasetImportJobStatus'
          description: Current status of the import job.
        accepted_count:
          type: integer
          description: Number of records successfully ingested. Present when status is `complete` or `partial`.
        rejected_count:
          type: integer
          description: Number of records rejected. Present when status is `partial`.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportJobError'
          description: Record-level validation errors. Present when status is `partial`.
        reason:
          type: string
          description: Human-readable reason for failure. Present when status is `failed`.
      required:
        - dataset_id
        - import_id
        - type
        - created_at
        - updated_at
        - status
      description: >-
        Tracks the lifecycle of a single file upload to a V4 dataset.


        An import job is created when `GET /datasets/{dataset_id}/upload-url/{filename}` is called. It transitions
        through the following statuses:


        | Status | Meaning |

        |---|---|

        | `uninitialised` | Import job created; file not yet uploaded to S3 |

        | `queued` | File uploaded; queued for extraction |

        | `processing` | Extraction in progress |

        | `complete` | All records accepted |

        | `partial` | Some records accepted, some rejected — see `errors` |

        | `failed` | Extraction failed entirely — see `reason` |

        | `pending_schema` | Dataset has no schema; upload paused until schema is set |


        Poll `GET /datasets/{dataset_id}/imports/{import_id}` until a terminal status is reached (`complete`, `partial`,
        `failed`, or `pending_schema`).
      title: DatasetImportJob
