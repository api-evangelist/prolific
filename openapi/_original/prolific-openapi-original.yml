        ACTIVE:
          type: number
          format: double
        APPROVED:
          type: number
          format: double
        AWAITING REVIEW:
          type: number
          format: double
        REJECTED:
          type: number
          format: double
        RESERVED:
          type: number
          format: double
        RETURNED:
          type: number
          format: double
        TIMED-OUT:
          type: number
          format: double
        PARTIALLY APPROVED:
          type: number
          format: double
        SCREENED OUT:
          type: number
          format: double
        TOTAL:
          type: number
          format: double
