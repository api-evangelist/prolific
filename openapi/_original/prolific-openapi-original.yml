          type: string
          description: ID of the "select" type filter.
        selected_values:
          type: array
          items:
            type: string
          description: >-
            This schema applies for filters of the `select` type, as defined in the [filter list
            response](\#tag/Filters/paths/~1api~1v1~1filters~1/get).


            Array of IDs matching the response IDs, from the `select` filter's `choices` (see response linked above).


            String format should match the `data_type` of the `select` filter's `choices` (see response linked above).
        weightings:
          type: object
          additionalProperties:
            type: number
            format: double
          description: |-
            Ratios to control the distribution of participants across the selected values.

            Integer percentages, floats, and exact quantities are valid inputs.
      required:
        - filter_id
        - selected_values
      title: SelectFilter
    RangeFilterSelectedRangeLower:
      oneOf:
        - type: integer
        - type: string
        - type: number
          format: double
      description: Your selected lower bound for the range.
      title: RangeFilterSelectedRangeLower
    RangeFilterSelectedRangeUpper:
      oneOf:
        - type: integer
        - type: string
        - type: number
          format: double
      description: Your selected upper bound for the range.
      title: RangeFilterSelectedRangeUpper
    RangeFilterSelectedRange:
      type: object
      properties:
        lower:
          $ref: '#/components/schemas/RangeFilterSelectedRangeLower'
          description: Your selected lower bound for the range.
        upper:
          $ref: '#/components/schemas/RangeFilterSelectedRangeUpper'
          description: Your selected upper bound for the range.
      description: >-
        This schema applies for filters of the `range` type, as defined in the [filter list
        response](\#tag/Filters/paths/~1api~1v1~1filters~1/get).


        A dictionary with two possible objects, 'lower' and 'upper'. At least one must be present and a non-null value.


        The expected data type for these values is defined by the `range` filter's `data_type` (see response linked
        above).


        If the data_type is a date, string format should be a parseable ISO8601 date string. Date values should be
        provided as a string in ISO 8601 format.


        Leaving a value as null will result in that bound being set to the lowest or highest possible value, depending
        on whether it is the upper or lower bound.
      title: RangeFilterSelectedRange
    RangeFilterWeightingsSelectedRangeLower:
      oneOf:
        - type: integer
        - type: string
        - type: number
          format: double
      title: RangeFilterWeightingsSelectedRangeLower
    RangeFilterWeightingsSelectedRangeUpper:
      oneOf:
        - type: integer
        - type: string
        - type: number
          format: double
      title: RangeFilterWeightingsSelectedRangeUpper
    RangeFilterWeightingsSelectedRange:
      type: object
      properties:
        lower:
          $ref: '#/components/schemas/RangeFilterWeightingsSelectedRangeLower'
        upper:
          $ref: '#/components/schemas/RangeFilterWeightingsSelectedRangeUpper'
      title: RangeFilterWeightingsSelectedRange
    RangeFilterWeightings:
      type: object
      properties:
        selected_range:
          $ref: '#/components/schemas/RangeFilterWeightingsSelectedRange'
        weighting:
          type: number
          format: double
      required:
        - selected_range
        - weighting
      title: RangeFilterWeightings
    RangeFilter:
      type: object
      properties:
        filter_id:
          type: string
          description: ID of the "range" type filter.
        selected_range:
          $ref: '#/components/schemas/RangeFilterSelectedRange'
          description: >-
            This schema applies for filters of the `range` type, as defined in the [filter list
            response](\#tag/Filters/paths/~1api~1v1~1filters~1/get).


            A dictionary with two possible objects, 'lower' and 'upper'. At least one must be present and a non-null
            value.


            The expected data type for these values is defined by the `range` filter's `data_type` (see response linked
            above).


            If the data_type is a date, string format should be a parseable ISO8601 date string. Date values should be
            provided as a string in ISO 8601 format.


            Leaving a value as null will result in that bound being set to the lowest or highest possible value,
            depending on whether it is the upper or lower bound.
        weightings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RangeFilterWeightings'
          description: |-
            Ratios to control the distribution of participants across the selected values.

            Integers and exact quantities are valid inputs.
      required:
        - filter_id
        - selected_range
      title: RangeFilter
    CompositeFilterFilterId:
