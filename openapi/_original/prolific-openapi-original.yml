      summary: Update credential pool
      description: >-
        Add new credentials to an existing credential pool. This operation is additive - new credentials are appended to
        the existing pool rather than replacing them. The credentials service validates that no duplicate usernames
        exist.

        The credentials are provided as a CSV string where each line contains a username and password separated by a
        comma (e.g., "user4,pass4\nuser5,pass5").
      tags:
        - credentials
      parameters:
        - name: credential_pool_id
          in: path
          description: Credential pool ID
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential pool updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credentials_UpdateCredentialPool_Response_200'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Forbidden - User does not have workspace.workspace_update permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Not Found - Credential pool does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: Conflict - Duplicate credentials detected (username already exists in pool)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '502':
          description: Bad Gateway - Credentials service unavailable or internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                credentials:
                  type: string
                  description: CSV-formatted credentials to add (username,password per line)
              required:
                - credentials
