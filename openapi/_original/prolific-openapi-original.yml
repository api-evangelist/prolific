    patch:
      operationId: update-task-builder-batch
      summary: Update a Batch
      description: >-
        Update an existing AI Task Builder batch. You can update the name, task details, associated dataset, and/or
        `batch_items`. The dataset does not need to be in READY status for updates.


        When updating `batch_items`, include the `id` of any existing pages, rows, columns, or items you want to
        preserve — items without an `id` are treated as new and assigned one server-side. Omitting an existing `id`
        removes that entry. The same validation rules as on create apply, and validation failures return **`422
        Unprocessable Entity`** with the `BatchItemsValidationError` payload.
      tags:
        - aiTaskBuilder
      parameters:
        - name: batch_id
          in: path
          description: The unique identifier of the batch
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AITaskBuilderBatch'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity — `batch_items` failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchItemsValidationError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                task_details:
                  $ref: >-
                    #/components/schemas/ApiV1DataCollectionBatchesBatchIdPatchRequestBodyContentApplicationJsonSchemaTaskDetails
                dataset_id:
                  type: string
                  format: uuid
                batch_items:
                  type:
                    - array
                    - 'null'
                  items:
                    $ref: '#/components/schemas/BatchItemsPage'
                  description: |-
                    Replacement layout for the batch's instructions and content. Include the `id`
                    of any existing pages, rows, columns, or items you want to preserve; omit `id`
                    to add new entries. Items absent from the payload are removed.
                auto_sync_enabled:
                  type: boolean
                  description: |-
                    When `true`, datapoints subsequently appended to the batch's attached dataset
                    (via `POST /datasets/{dataset_id}/datapoints`) automatically trigger a sync that
                    materialises tasks for them — no explicit `POST /batches/{batch_id}/sync` call is
                    needed. When `false`, appended datapoints are only picked up by an explicit
                    sync. If this field is omitted from the PATCH payload, the existing auto-sync
                    setting is left unchanged.
  /api/v1/data-collection/batches/{batch_id}/sync:
    post:
      operationId: sync-task-builder-batch
      summary: Sync a Batch
      description: |-
        Triggers an asynchronous sync job that materialises tasks for any datapoints appended to the
        batch's attached dataset since it was set up (or since the last sync). Returns immediately
        with a `sync_id`; the work is performed by a background worker.

        The batch must be in `READY` status and have an attached dataset. Syncs for the same batch are
        serialised, so a new sync picks up wherever the previous one left off.

        Poll `GET /batches/{batch_id}/syncs/{sync_id}` until the returned job reaches a terminal
        status (`complete` or `failed`).
      tags:
        - aiTaskBuilder
      parameters:
        - name: batch_id
          in: path
          description: The unique identifier of the batch to sync
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '202':
          description: |-
            Sync job accepted and queued. The returned job has status `queued`; poll the sync-status
            endpoint for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/data-collection/batches/{batch_id}/syncs/{sync_id}:
    get:
      operationId: get-batch-sync-status
      summary: Get Batch Sync Status
      description: >-
        Returns the current status of a batch sync job created by `POST /batches/{batch_id}/sync`.


        A sync job transitions through the following statuses:

        - `queued` — sync accepted, awaiting the background worker.

        - `processing` — the worker is materialising tasks.


        **Terminal statuses:**

        - `complete` — the sync finished. `tasks_created`, `datapoints_processed`, `groups_created`, and
        `groups_expanded` are populated.

        - `failed` — the sync failed. `reason` is populated.


        Continue polling while the status is `queued` or `processing`.
      tags:
        - aiTaskBuilder
      parameters:
        - name: batch_id
          in: path
          description: The unique identifier of the batch
          required: true
          schema:
            type: string
            format: uuid
        - name: sync_id
          in: path
          description: The sync job ID returned by `POST /batches/{batch_id}/sync`
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sync job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Sync job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/data-collection/batches/{batch_id}/status:
    get:
      operationId: get-task-builder-batch-status
