        in the total_allocation field. Sending both access_details and total_available_places will increase places on
        existing URLs by the number specified on the access_detail.

        - data_collection_metadata.annotators_per_task: For AI Task Builder Batch studies, you can increase the number
        of annotators per task. This will automatically recalculate `total_available_places` based on the number of task
        groups multiplied by the new value. Note: This value can only be increased, not decreased, on a published study.

