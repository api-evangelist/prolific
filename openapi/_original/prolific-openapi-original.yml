        - $ref: '#/components/schemas/RequestReturn'
        - $ref: '#/components/schemas/DynamicPayment'
        - $ref: '#/components/schemas/FixedScreenOut'
      title: CreateStudyCompletionCodesItemsActionsItems
    CreateStudyCompletionCodesItemsActor:
      type: string
      enum:
        - participant
        - researcher
      default: participant
      description: The actor that can provide this completion code.
      title: CreateStudyCompletionCodesItemsActor
    CreateStudyCompletionCodesItems:
      type: object
      properties:
        code:
          type:
            - string
            - 'null'
          description: >
            The code the participant will either enter manually at the end of your study or be redirected as part of the
            return URL.


            If the code is null, then the participant will not be asked to submit a completion code when they return to
            Prolific.

            Null codes can only be provided when:
              - The actor is "participant"
              - There are no other completion codes with the "participant" actor
              - The actions array is empty

            The code must be unique within the study.
        code_type:
          $ref: '#/components/schemas/CreateStudyCompletionCodesItemsCodeType'
          description: >
            A name for your code to make it easier to understand its intention. Either use one of the predefined options
            or any other free text.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/CreateStudyCompletionCodesItemsActionsItems'
          description: >-
            The actions that will be completed automatically when the submission is completed with this code by the
            participant.


            You have the ability to use one or multiple `actions` together - it's up to you and your desired automated
            journey.


            If you’re looking to keep things simple, we recommend setting the `{"action": "MANUALLY_REVIEW"}` option
            only, so all submissions wait for your manual approval.
        actor:
          $ref: '#/components/schemas/CreateStudyCompletionCodesItemsActor'
          default: participant
          description: The actor that can provide this completion code.
      required:
        - code
        - code_type
        - actions
      title: CreateStudyCompletionCodesItems
