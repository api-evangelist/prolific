  /api/v1/reward-recommendations/:
    get:
      operationId: calculate-reward-recommendations
      summary: Calculate reward recommendations
      description: >-
        Calculate the recommended participant reward rates for a data collection, optionally based upon a given set of
        filters
      tags:
        - rewardRecommendations
      parameters:
        - name: workspace_id
          in: query
          description: The ID of the workspace in which you'll be creating the study
          required: true
          schema:
            type: string
        - name: currency
          in: query
          description: An ISO 4217 currency code. Note that we only support a selection of currency codes as per the enum values.
          required: true
          schema:
            $ref: '#/components/schemas/ApiV1RewardRecommendationsGetParametersCurrency'
        - name: screener_ids
          in: query
          description: >-
            A URL-encoded, comma-delimited list of filter IDs (e.g. custom group filter IDs) that you plan to apply to
            your study.


            There are various methods of converting an array of filter IDs to a URL-encoded, comma delimited array e.g:


            JavaScript:


            ```js

            const screenerIDs = ["mandarin", "spanish"];

            const encodedScreenerIDs = encodeURIComponent(screenerIDs.join(","));

            const url =
            `https://api.prolific.com/api/v1/reward-recommendations?screener_ids=${encodedScreenerIDs}&workspace_id=<workspace
            ID>&currency=GBP`

            ```


            Python:


            ```python

            import urllib.parse


            screener_ids = ["mandarin", "spanish"]

            encoded_screener_ids = urllib.parse.quote(",".join(screener_ids))

            url =
            f"https://api.prolific.com/api/v1/reward-recommendations?screener_ids={encoded_screener_ids}&workspace_id=<workspace
            ID>&currency=GBP"

            ```
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >
            A list of reward recommendations. We suggest using the first recommendation in the list as this is
            guaranteed to be the most recent set of reward rates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardRecommendationsResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /.well-known/study/jwks.json:
    get:
      operationId: get-study-jwks
      summary: Retrieve JSON Web Key Set (JWKS)
      description: >
        Fetches the public keys that can be used to verify JWTs signed by Prolific. Clients should cache these keys and
        update them at least daily.


        To verify the signature of a JWT you must verify the following:

        * The JWT signature is authentic by verifying it with the public key from Prolific that correlates with the KID.

        * The JWT hasn't expired, by checking the `exp` claim.

        * The `aud` claim is the correct domain for your tool.

        * The `prolific` claim matches your expected payload as set in the `external_study_url` property. It always
        includes `workspace_id`. When the workspace is linked to an organisation, it also includes `organisation_id`.
      tags:
        - wellKnownEndpoints
      responses:
        '200':
          description: Successful response with the JWKS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSResponse'
