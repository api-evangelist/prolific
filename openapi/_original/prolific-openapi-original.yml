  /api/v1/submissions/:
    get:
      operationId: get-submissions
      summary: List submissions
      description: |-
        Returns basic information of submissions, including study id, participant id, status and start timestamp.

        **Filtering and Ordering:**
        - Filter by status, completion state, dates, and study
        - Order by start time, reward amount, or study name
        - Paginate by page_size and page (Default page_size is 20)
        - Boolean parameters accept multiple formats: 1/0, true/false, yes/no, t/f (case-insensitive)
        - Date parameters use DD/MM/YYYY format
        - Status parameters are case-insensitive with underscore normalization
      tags:
        - submissions
      parameters:
        - name: study
          in: query
          description: Filter by study ID (required). This is the ID we pass to the survey platform using %STUDY_ID%
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: >-
            Filter by submission status (case-insensitive). Valid values include ACTIVE, AWAITING_REVIEW, APPROVED,
            REJECTED, RETURNED, SCREENED_OUT, TIMED-OUT
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1SubmissionsGetParametersStatus'
        - name: completed
          in: query
          description: >-
            Filter by completion status. Accepts 1/true/yes/t for completed, 0/false/no/f for incomplete
            (case-insensitive)
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1SubmissionsGetParametersCompleted'
        - name: returned
          in: query
          description: >-
            Filter by returned status. Accepts 1/true/yes/t for returned, 0/false/no/f for not returned
            (case-insensitive)
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1SubmissionsGetParametersReturned'
        - name: awaiting_review
          in: query
          description: >-
            Filter by awaiting review status. Accepts 1/true/yes/t for awaiting review, 0/false/no/f for not awaiting
            review (case-insensitive)
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1SubmissionsGetParametersAwaitingReview'
        - name: approved
          in: query
          description: >-
            Filter by approved status. Accepts 1/true/yes/t for approved, 0/false/no/f for not approved
            (case-insensitive)
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1SubmissionsGetParametersApproved'
        - name: active
          in: query
          description: Filter by active status. Accepts 1/true/yes/t for active, 0/false/no/f for not active (case-insensitive)
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1SubmissionsGetParametersActive'
        - name: timeout
          in: query
          description: >-
            Filter by timed out status. Accepts 1/true/yes/t for timed out, 0/false/no/f for not timed out
            (case-insensitive)
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1SubmissionsGetParametersTimeout'
        - name: rejected
          in: query
          description: >-
            Filter by rejected status. Accepts 1/true/yes/t for rejected, 0/false/no/f for not rejected
            (case-insensitive)
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1SubmissionsGetParametersRejected'
        - name: screened_out
          in: query
          description: >-
            Filter by screened out status. Accepts 1/true/yes/t for screened out, 0/false/no/f for not screened out
            (case-insensitive)
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1SubmissionsGetParametersScreenedOut'
        - name: completeoractive
          in: query
          description: >-
            Filter for submissions that are either completed or active. Accepts 1/true/yes/t to include, 0/false/no/f to
            exclude (case-insensitive)
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1SubmissionsGetParametersCompleteoractive'
        - name: submitted_from
          in: query
          description: Filter submissions completed after the given date. Format DD/MM/YYYY (e.g., 01/01/2024)
          required: false
          schema:
            type: string
        - name: submitted_before
          in: query
          description: Filter submissions completed before the given date. Format DD/MM/YYYY (e.g., 31/12/2024)
          required: false
          schema:
            type: string
        - name: ordering
          in: query
          description: >-
            Order results by field. Prefix with '-' for descending order. Supported values are started_at,
            submission_reward, study_name
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1SubmissionsGetParametersOrdering'
        - name: page_size
          in: query
          description: Number of items to return per page (Default 20)
          required: false
          schema:
            type: integer
        - name: page
          in: query
          description: Page number to retrieve (Default 1)
          required: false
          schema:
            type: integer
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionListResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
