  /api/v1/studies/{id}/demographic-export/:
    post:
      operationId: export-demographic-data
      summary: Export demographic data
      description: >-
        Create and download a demographic export for a study. This endpoint allows you to export participant demographic
        data with optional study filter data.


        **Filter Support**: This endpoint supports applying demographic filters to export data for participants who
        match specific criteria.


        When filters are provided, the export includes both base demographic data (age, sex, country, etc.) and the
        filters.


        When no filters are provided, the export includes only base demographic data for all participants who took the
        study, excluding any study-specific filter responses.


        **Export Usage**: Please note that you may only select up to 15 filters per export. You are also limited to 2
        different filter export requests.


        You may download the same request as many times as you need. To check your current usage and see your latest
        export history, use the [Demographic Export
        History](https://docs.prolific.com/docs/api-docs/public/#tag/Studies/operation/GetDemographicExportHistory)
        endpoint.


        **Basic Data Included**: The export includes the following data fields:

        * Submission ID

        * Participant ID

        * Submission status

        * Started date-time
          * Expressed in UTC
          * ISO 8601 formatted
        * Completed date-time
          * Expressed in UTC
          * ISO 8601 formatted
        * Time taken (in seconds)

        * Age

        * Sex
          * Participants were asked the following question: What is your sex, as recorded on legal/official documents?
        * Ethnicity (simplified)

        * First language

        * Current country of residence

        * Nationality

        * Country of birth

        * Student status

        * Employment status

        * Reviewed at date-time
          * Expressed in UTC
          * ISO 8601 formatted
        * Completion code ('entered code')

        * Total approvals


        Learn more on [Exporting Prolific demographic data](https://researcher-help.prolific.com/en/article/b2943f).
      tags:
        - studies
      parameters:
        - name: id
          in: path
          description: Study ID
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Demographic data exported successfully
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemographicExportRequest'
