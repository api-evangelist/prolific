  /api/v1/studies/{id}/clone/:
    post:
      operationId: duplicate-study
      summary: Duplicate a study
      description: >-
        Duplicating a study can save a lot of time and effort compared to creating a new study from scratch, since all
        of the information and data from the original study will be carried over to the new study. Additionally,
        duplicating a study can help ensure that the new study is set up consistently with the original, reducing the
        risk of errors or inconsistencies.


        To prevent repeat participation, a block list containing the original study will be added to the duplicated
        study's filters unless `block_previous_participants` is set to `false` in the request body.
      tags:
        - studies
      parameters:
        - name: id
          in: path
          description: Study id
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Duplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                block_previous_participants:
                  type: boolean
                  default: true
                  description: Controls whether the block list is added or not.
