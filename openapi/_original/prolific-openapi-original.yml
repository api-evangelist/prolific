  /api/v1/submissions/{id}/transition/:
    post:
      operationId: transition-submission
      summary: Approve or reject a submission
      description: >-
        Transition a submission to `APPROVED`, `REJECTED`, `PARTIALLY APPROVED`, `AWAITING REVIEW` or `SCREENED OUT`.
        Once the status is changed, it can not be restored to its previous value.


        You can only transition a submission to PARTIALLY APPROVED or SCREENED OUT by:
          - setting up the study with the appropriate completion codes (only some workspaces have access to these features)
          - providing the correct completion code in the request body
          - providing the necessary data in the request body (to PARTIALLY APPROVE a submission)

        Note this endpoint is idempotent, so if you make the same request twice, the second request will be ignored.
      tags:
        - submissions
      parameters:
        - name: id
          in: path
          description: |-
            Submission id. This is the ID we pass to the survey platform
            using %SESSION_ID%
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionTransition'
  /api/v1/submissions/{id}/request-return/:
    post:
      operationId: request-submission-return
      summary: Request the participant who submitted the response to return their response
      description: >
        **This is an experimental feature that may be subject to change in the future.** <br/>

        It offers researchers the ability to ask a participant to return a submission. The return reason must be
        provided in the request and can be any free text string. <br/> The Prolific UI allows users to select any of the
        following options:

        * Didn't finish the study

        * Encountered technical problems

        * Withdrew consent

        * Other ( uses the free text input)


        This constructs a message around the reasons provided so there is no need to provide additional text beyond the
        reasons.

        <img alt="Example" src="/assets/img/api/message.png" />
      tags:
        - submissions
      parameters:
        - name: id
          in: path
          description: The submission id
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            The Prolific API uses API token to authenticate requests. You can create an API token directly from your
            settings.


            Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


            If your token is leaked, delete it and create a new one directly in the app.


            In your requests add `Authorization` header with the value `Token <your token>`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            A message is sent to the participant belonging to the submission asking them to return.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequestedResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                request_return_reasons:
                  type: array
                  items:
                    type: string
              required:
                - request_return_reasons
  /api/v1/submissions/bulk-approve/:
    post:
      operationId: bulk-approve-submissions
      summary: Bulk approve submissions
      description: >-
        Bulk approve study submissions to pay participants after they have

        completed your survey or experiment. There are two variant payloads to

        this request.


        - You can supply a Study ID, and a list of participant IDs, or

