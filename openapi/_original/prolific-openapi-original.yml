      title: SubmissionsCountResponse
    DemographicExportRequestFiltersItems:
      oneOf:
        - $ref: '#/components/schemas/SelectFilter'
        - $ref: '#/components/schemas/RangeFilter'
        - $ref: '#/components/schemas/CompositeFilter'
      title: DemographicExportRequestFiltersItems
    DemographicExportRequest:
      type: object
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/DemographicExportRequestFiltersItems'
          description: >-
            List of filters to apply to the demographic export.


            When filters are provided, the export includes both base demographic data and responses to the specified
            filters which were applied to the study.


            When empty, only base demographic data (age, sex, country, etc.) for all participants who took the study is
            exported, excluding study-specific filter responses.
      title: DemographicExportRequest
    DemographicExportHistoryResponseFiltersItems:
      oneOf:
