        - FAILED_ATTENTION_CHECK
        - FOLLOW_UP_STUDY
        - GIVE_BONUS
        - INCOMPATIBLE_DEVICE
        - NO_CONSENT
        - OTHER
        - FIXED_SCREENOUT
        - SCREENED_IN
        - SCREENED_OUT
      description: >
        A name for your code to make it easier to understand its intention. Either use one of the predefined options or
        any other free text.
      title: BaseStudyCompletionCodesItemsCodeType
    BaseStudyCompletionCodesItemsActionsItems:
      oneOf:
        - $ref: '#/components/schemas/AutomaticallyApprove'
