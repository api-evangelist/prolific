            for your analysis.


            Use 'not_required' if you don't need to record them.
        completion_codes:
          type: array
          items:
            $ref: '#/components/schemas/CreateStudyCompletionCodesItems'
          description: >-
            Specify at least one completion code for your study. A participant will enter one of these codes when they
            complete your study.


            Each code must be unique within a study.


            You can specify as many actions as you like per code. However, some actions can't be used together (e.g.
            AutomaticallyApprove and ManuallyReview).


            **Note:** This field is optional when `data_collection_method` is set to `AI_TASK_BUILDER_BATCH` or
            `AI_TASK_BUILDER_COLLECTION`. When omitted, a default COMPLETED code with a `MANUALLY_REVIEW` action is
            auto-generated. When provided, AITB studies must include exactly one code with `code_type` of `COMPLETED`
            and an action of `MANUALLY_REVIEW` or `AUTOMATICALLY_APPROVE`.
