            - "WORKSPACE_ADMIN": The user will have administrative rights in the workspace. They can manage settings,
            invite users, and oversee all projects.

            - "WORKSPACE_COLLABORATOR": The user will be a regular collaborator in the workspace. They can contribute to
            projects but don't have administrative rights.
      title: CreateInvitationRequest
    InvitationInvitee:
      type: object
      properties:
        id:
          type:
            - string
            - 'null'
          format: objectId
          description: The unique ID of the invitee.
        name:
          type:
            - string
            - 'null'
          description: The name of the invitee.
        email:
          type: string
          format: email
          description: The email address of the invitee.
      title: InvitationInvitee
    InvitationStatus:
      type: string
      enum:
        - INVITED
        - ACCEPTED
      description: The current status of the invitation.
      title: InvitationStatus
    InvitationRole:
      type: string
      enum:
        - WORKSPACE_ADMIN
        - WORKSPACE_COLLABORATOR
      description: Assigned role for the user in this workspace.
      title: InvitationRole
    Invitation:
      type: object
      properties:
        association:
          type: string
          format: objectId
          description: The ID of the workspace to which the invitee was invited.
        invitee:
          $ref: '#/components/schemas/InvitationInvitee'
        invited_by:
          type: string
          format: objectId
          description: The ID of the user who sent the invitation.
        status:
          $ref: '#/components/schemas/InvitationStatus'
          description: The current status of the invitation.
        invite_link:
          type: string
          format: uri
          description: The link that the invitee can use to accept the invitation.
        role:
          $ref: '#/components/schemas/InvitationRole'
          description: Assigned role for the user in this workspace.
      title: Invitation
    CreateInvitationResponse:
      type: object
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
      title: CreateInvitationResponse
    ApiV1RewardRecommendationsGetParametersCurrency:
      type: string
      enum:
        - USD
        - GBP
      title: ApiV1RewardRecommendationsGetParametersCurrency
    RewardRecommendationsResponseItemsCurrency:
      type: string
      enum:
        - USD
        - GBP
      description: An ISO 4217 currency code. Note that we only support a selection of currency codes as per the enum values.
      title: RewardRecommendationsResponseItemsCurrency
    RewardRecommendationsResponseItems:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/RewardRecommendationsResponseItemsCurrency'
          description: An ISO 4217 currency code. Note that we only support a selection of currency codes as per the enum values.
        min_reward_per_hour:
          type: integer
          description: >
            The **minimum** hourly reward rate that we recommend you pay to your study's participants.


            **Note that** this is returned as the hundredth subunit of the given currency i.e:


            * for USD, this will be the value in cents

            * for GBP, this will be the value in pence


            To display this as USD or GBP respectively, you'll need to divide this value by 100 and use an appropriate
            number formatting API e.g:


            JavaScript:


            ```js

            new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(2000/ 100); // "$20.00"

            ```
        recommended_reward_per_hour:
          type: integer
          description: >
            The **good** hourly reward rate that we recommend you pay to your study's participants.


            **Note that** this is returned as the hundredth subunit of the given currency i.e:


            * for USD, this will be the value in cents

            * for GBP, this will be the value in pence


            To display this as USD or GBP respectively, you'll need to divide this value by 100 and use an appropriate
            number formatting API e.g:


            JavaScript:


            ```js

            new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(2000/ 100); // "$20.00"

            ```
      title: RewardRecommendationsResponseItems
    RewardRecommendationsResponse:
      type: array
      items:
        $ref: '#/components/schemas/RewardRecommendationsResponseItems'
      title: RewardRecommendationsResponse
    JwkKty:
      type: string
      enum:
        - RSA
      description: Key type, always "RSA".
      title: JwkKty
    JwkAlg:
      type: string
      enum:
        - RS256
      description: Algorithm used, always "RS256".
      title: JwkAlg
    JwkUse:
      type: string
      enum:
        - sig
      description: The intended use of the public key.
      title: JwkUse
    JwkKeyOpsItems:
      type: string
      enum:
        - verify
      title: JwkKeyOpsItems
    JWK:
      type: object
      properties:
        kty:
          $ref: '#/components/schemas/JwkKty'
          description: Key type, always "RSA".
        kid:
          type: string
          description: Key ID used to match the key to the JWT header.
        alg:
          $ref: '#/components/schemas/JwkAlg'
          description: Algorithm used, always "RS256".
        'n':
          type: string
          description: The modulus of the RSA public key.
        e:
          type: string
          description: The exponent of the RSA public key.
        use:
          $ref: '#/components/schemas/JwkUse'
          description: The intended use of the public key.
        key_ops:
          type: array
          items:
            $ref: '#/components/schemas/JwkKeyOpsItems'
          description: The operations that the key is intended to be used for.
      required:
        - kty
        - kid
        - alg
        - 'n'
        - e
        - use
        - key_ops
      title: JWK
    JWKSResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWK'
      title: JWKSResponse
