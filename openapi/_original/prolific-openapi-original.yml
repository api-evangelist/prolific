        description:
          type: string
          description: >-
            Description of the study for the participants to read before

            starting the study


            **Supported HTML in `description`**


            The `description` field supports the following HTML tags for formatting participant instructions:


            * `<b>` - bold

            * `<i>` - italic

            * `<em>` - emphasized text

            * `<strong>` - strong importance

            * `<s>` - strikethrough

            * `<u>` - underline

            * `<h1>` - heading level 1

            * `<h2>` - heading level 2

            * `<ol>` - ordered list

            * `<ul>` - unordered list

            * `<li>` - list item

            * `<p>` - paragraph


            Other HTML tags will be stripped or escaped. Please ensure that you only use supported tags for formatting
            to avoid rendering issues.
        external_study_url:
          type: string
          description: >-
            URL of the survey or experiment you want participant to access. You can pass URL search parameters to your
            survey or experiment


            * Participant id {{%PROLIFIC_PID%}}

            * Study id {{%STUDY_ID%}}

            * Session id {{%SESSION_ID%}}


            For example `https://eggs-experriment.com?participant={{%PROLIFIC_PID%}}`
        prolific_id_option:
          $ref: '#/components/schemas/CreateStudyProlificIdOption'
          description: >-
            Use 'question' if you will add a question in your survey or experiment asking the participant ID


