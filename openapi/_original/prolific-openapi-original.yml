          type: boolean
          description: >-
            When set to true, any query parameters in the external study url will be signed with a JSON Web Token. The
            token will be added to the URL as a query parameter named `prolific_token`.


            This feature is only available to certain workspaces.


            **The JWT payload**


            Header:


            ```json

            {
              "alg": "RS256",
              "kid": "<KEY_ID>",
              "typ": "JWT"
            }

            ```


            Where

            - alg is always RS256.

            - kid indicates the key ID that was used to secure the JWT.

            - typ is always JWT.


