        - `text` — a text value shown to participants. Can be referenced by `dataset_field` items in `batch_items`.

        - `image_url` — a URL pointing to an image shown to participants. Can be referenced by `dataset_field` items in `batch_items`.

        - `metadata` — an internal value included in exports but not shown to participants (equivalent to the `META_` prefix in V3 CSV datasets).

        - `task_group_id` — groups datapoints into task groups. Rows with the same `task_group_id` value are assigned to the same participant. Equivalent to `META_TASK_GROUP_ID` in V3 CSV datasets. At most one field per schema may have this type.'
      title: DatasetSchemaFieldType
    BatchExportStatusOneOf2Status:
