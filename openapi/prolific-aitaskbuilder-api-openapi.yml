    patch:
      operationId: update-task-builder-dataset
      summary: Update a Dataset Schema
      description: 'Updates the schema of an existing **V4 dataset**. Each successful update writes a new schema

        version.


        **Schema migration.** If the dataset already had a schema, changing it starts an asynchronous

        **schema migration** that re-normalises the dataset''s existing datapoints against the new

        version. In that case the response includes a `migration_job_id`; poll

        `GET /datasets/{dataset_id}/schema-migrations/{job_id}` with it until the job reaches a

        terminal status. When this is the dataset''s **first** schema, no migration is needed and

        `migration_job_id` is omitted.


        **Constraints:**

        - V4 datasets only — a `400` is returned for V3 datasets.

        - The `task_group_id` column designation cannot be changed once the dataset has datapoints; attempting to do so returns `400`.'
      tags:
      - aiTaskBuilder
      parameters:
      - name: dataset_id
        in: path
        description: The unique identifier of the V4 dataset to update
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: 'The Prolific API uses API token to authenticate requests. You can create an API token directly from your settings.


          Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


          If your token is leaked, delete it and create a new one directly in the app.


          In your requests add `Authorization` header with the value `Token <your token>`.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Dataset updated. Returns the updated dataset. When the update triggered a schema

            migration, `migration_job_id` is present — poll the schema-migration endpoint with it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AI Task Builder_UpdateTaskBuilderDataset_Response_200'
        '400':
          description: 'Bad request — not a V4 dataset, or an attempt to change the `task_group_id` column on a

            dataset that already has datapoints.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the user does not have access to the dataset's workspace.
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                schema:
                  $ref: '#/components/schemas/DatasetSchema'
                  description: The new schema definition for the dataset.
              required:
              - schema
