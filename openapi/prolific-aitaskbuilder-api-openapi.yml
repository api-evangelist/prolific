  /api/v1/data-collection/datasets/{dataset_id}/imports/{import_id}:
    get:
      operationId: get-dataset-import-status
      summary: Get Dataset Import Status
      description: 'Returns the current status of a V4 dataset import job. Each import job represents one ingestion operation and transitions through the following statuses:

        - `uninitialised` — Presigned url requested, but not yet used

        - `processing` — Datapoints received for ingestion, work underway

        - `queued` — Datapoints received for ingestion, awaiting a previous import job to complete before processing can commence


        **Terminal statuses:**

        - `complete` — all records were accepted. `accepted_count` is populated.

        - `partial` — some records were accepted and some rejected. `accepted_count`, `rejected_count`, and `errors` are populated. The accepted records are available for use.

        - `failed` — extraction failed entirely (e.g. file could not be parsed). `reason` is populated. No records were ingested.

        - `pending_schema` — the dataset has no schema set; upload is paused until a schema is defined.


        Continue polling while the status is `uninitialised`, `queued`, or `processing`.'
      tags:
      - aiTaskBuilder
      parameters:
      - name: dataset_id
        in: path
        description: The unique identifier of the dataset
        required: true
        schema:
          type: string
          format: uuid
      - name: import_id
        in: path
        description: The import job ID returned by `GET /datasets/{dataset_id}/upload-url/{filename}`
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: 'The Prolific API uses API token to authenticate requests. You can create an API token directly from your settings.


          Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


          If your token is leaked, delete it and create a new one directly in the app.


          In your requests add `Authorization` header with the value `Token <your token>`.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Import job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetImportJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Import job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/data-collection/datasets/{dataset_id}/datapoints:
    post:
      operationId: append-dataset-datapoints
      summary: Append Datapoints to a Dataset
      description: 'Synchronously appends one or more JSONL records to an existing **V4 dataset**. Unlike the

        file-upload flow, this endpoint processes the whole payload within the request and returns the

        accepted/rejected counts directly — there is no async import job to poll.


        **Request body:** JSONL — one JSON object per line — sent with a JSONL content type

        (e.g. `application/x-ndjson`). Blank lines are skipped. CSV is not supported on this endpoint.


        Each record is validated against the dataset''s current schema. Valid records are persisted as

        datapoints and sort after every existing datapoint. Records that are malformed or violate the

        schema are rejected individually and reported in `errors` — they do not fail the whole request.

        Re-appending an identical record is idempotent (counted as accepted, not written twice).


        **Limits and preconditions:**

        - At most 1000 records per request. Larger imports should use the file-upload flow.

        - The dataset must be V4 and have a schema defined.

        - Rejected with `409 Conflict` while a dataset import or a schema migration is in progress.


        If the dataset is attached to any batches with `auto_sync_enabled`, a sync is triggered

        automatically for the newly written datapoints.'
      tags:
      - aiTaskBuilder
      parameters:
      - name: dataset_id
        in: path
        description: The unique identifier of the V4 dataset to append to
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: 'The Prolific API uses API token to authenticate requests. You can create an API token directly from your settings.


          Your API token does not have an expiry date and carries full permission, so be sure to keep them secure.


          If your token is leaked, delete it and create a new one directly in the app.


          In your requests add `Authorization` header with the value `Token <your token>`.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Append processed. Returns per-request accepted/rejected counts. A `200` is returned even

            when some (or all) records were rejected — inspect `rejected` and `errors`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetAppendResult'
        '400':
          description: 'Bad request — missing body, CSV payload, empty JSONL, too many records, a non-V4 dataset,

            or a dataset with no schema.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the user does not have access to the dataset's workspace.
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict — a dataset import or a schema migration is in progress. Retry once it completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: string
  /api/v1/data-collection/datasets/{dataset_id}/schema-migrations/{job_id}:
    get:
      operationId: get-schema-migration-status
      summary: Get Schema Migration Status
      description: "Returns the current status of a schema migration job, which reprocesses a V4 dataset's\ndatapoints against a newer schema version.\n\nA migration job has these statuses:\n- `processing` — the migration is underway.\n\n**Terminal statuses:**\n- `complete` — all datapoints were reprocessed. `reprocessed_count` is populated.\n- `partial` — some datapoints were reprocessed and some fields could not be re-normalised (and\n  were nulled). `reprocessed_count`, `failed_count`, and `errors` are populated.\n- `failed` — the migration failed entirely. `reason` is populated.\n\nContinue polling while the status is `processing`."
