        external_url:
          type: string
          description: URL of the task you want to send the participant to. You can pass URL search parameters as in `external_study_url`.
        total_allocation:
          type: number
          format: double
          description: 'The base number of places you want allocated to this URL. This value is set by you and is used to determine the study''s total available places.


            Note: for studies with custom screening (fixed screen-out reward), participants who are screened out generate additional capacity on top of this base value. The `allocated` count in progress responses may therefore exceed `total_allocation` — this is expected behaviour. See `capacity_increments` in the progress response for details.'
      required:
