    BaseStudy:
      type: object
      properties:
        name:
          type: string
          description: Public name or title of the study
        internal_name:
          type:
          - string
          - 'null'
          description: Internal name of the study, not shown to participants
        description:
          type: string
          description: 'Description of the study for the participants to read before

            starting the study


            **Supported HTML in `description`**


            The `description` field supports the following HTML tags for formatting participant instructions:


            * `<b>` - bold

            * `<i>` - italic

            * `<em>` - emphasized text

            * `<strong>` - strong importance

            * `<s>` - strikethrough

            * `<u>` - underline

            * `<h1>` - heading level 1

            * `<h2>` - heading level 2

            * `<ol>` - ordered list

            * `<ul>` - unordered list

            * `<li>` - list item

            * `<p>` - paragraph


            Other HTML tags will be stripped or escaped. Please ensure that you only use supported tags for formatting to avoid rendering issues.'
        external_study_url:
          type: string
          description: 'URL of the survey or experiment you want participant to access. You can pass URL search parameters to your survey or experiment


            * Participant id {{%PROLIFIC_PID%}}

            * Study id {{%STUDY_ID%}}

            * Session id {{%SESSION_ID%}}


            For example `https://eggs-experriment.com?participant={{%PROLIFIC_PID%}}`'
        prolific_id_option:
          $ref: '#/components/schemas/BaseStudyProlificIdOption'
          description: 'Use ''question'' if you will add a question in your survey or experiment asking the participant ID


            **Recommended** Use ''url_parameters'' if your survey or experiment can retrieve and store those parameters for your analysis.


            Use ''not_required'' if you don''t need to record them.'
        completion_codes:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudyCompletionCodesItems'
          description: 'Specify at least one completion code for your study. A participant will enter one of these codes when they complete your study.


            Each code must be unique within a study.


            You can specify as many actions as you like per code. However, some actions can''t be used together (e.g. AutomaticallyApprove and ManuallyReview).


            **Note:** This field is optional when `data_collection_method` is set to `AI_TASK_BUILDER_BATCH` or `AI_TASK_BUILDER_COLLECTION`. When omitted, a default COMPLETED code with a `MANUALLY_REVIEW` action is auto-generated. When provided, AITB studies must include exactly one code with `code_type` of `COMPLETED` and an action of `MANUALLY_REVIEW` or `AUTOMATICALLY_APPROVE`.'
        total_available_places:
          type: number
          format: double
          description: 'How many participants are you looking to recruit.


            **Note:** This field is optional when `data_collection_method` is set to `AI_TASK_BUILDER_BATCH`, as the total available places are automatically calculated from the batch configuration.'
        estimated_completion_time:
          type: number
          format: double
          description: Estimated duration in minutes of the experiment or survey
        maximum_allowed_time:
          type: number
          format: double
          description: 'Max time in minutes for a participant to finish the submission. Submissions are timed out if it takes longer.


            If it is not provided the default value is set to the max value.


            The min value is calculated as two minutes plus two times the estimated time plus two times the square root of the estimated time'
        reward:
          type: number
          format: double
          description: 'How much are you going to pay the participants in cents. We

            use the currency of your account.'
        device_compatibility:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudyDeviceCompatibilityItems'
          description: 'Add all devices that participants can use.

            You can include one or more options.


            An empty array indicates that all options are available.'
        peripheral_requirements:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudyPeripheralRequirementsItems'
          description: 'Add all requirements that participants have to meet.


            An empty array indicates that there are no extra peripheral requirements.'
        filters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BaseStudyFiltersItems'
          description: 'Array of filters.


            For advanced participant targeting with `and` / `or` groups, see [Advanced filtering](/api-reference/filters/advanced-filtering).


            Use empty array for "Everyone"'
        filter_set_id:
          type:
          - string
          - 'null'
          description: 'The ID of a filter set, from which filters for the study will be taken.


            For more information, see [Filter Sets](/api-reference/filter-sets).


            Note, this cannot be used in combination with additional filters via the `filters` field.'
        filter_set_version:
          type:
          - integer
          - 'null'
          description: 'The version of the filter set to be used.


            If not provided, this will default to the latest available version at the time of applying the filter set.'
        naivety_distribution_rate:
          type:
          - number
          - 'null'
          format: double
          description: 'Control the balance between speed of your studies and the naivety of the participants.


            If not defined, by default Prolific calculates the best rate for most studies

            taking into account the `filters` and the `total_available_places` needed for this study.


            Use 0 if your priority is speed. When this property is set to 0 all eligible participants will have access

            to your study at the same time, without any prioritization.


            You can also set this at a workspace and project level.'
        project:
          type: string
          description: Project ID. When you don't specify a project in your request, Prolific automatically uses your first created project as the default. For clarity, we recommend explicitly including the project ID in your requests.
        submissions_config:
          $ref: '#/components/schemas/BaseStudySubmissionsConfig'
          description: '**Advanced**: This helps with faster data collection. Your survey system will need to handle providing a

            unique experience each time the participant takes the study.


            Configuration related to study submissions. The purpose of this field is to capture any configuration options that impact the submissions made by participants in a study.'
        study_labels:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudyStudyLabelsItems'
          description: 'This field allows you to tag studies with information about the type/topic of the study and the kind of work involved in completing it.


            We plan to make this information available to participants for easier self-selection. At present these options are mutually exclusive and only a single option can be selected, however in the future available categories will expand.'
        content_warnings:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudyContentWarningsItems'
          description: 'Allow researchers to define content warnings for their study.


            At present these options are mutually exclusive and only a single option can be selected, however in the future available warnings will expand.'
        content_warning_details:
          type: string
          description: Allow researchers to add further details about their content warning.
        metadata:
          type:
          - string
          - 'null'
          description: "This field can be used to store extra information required for a system integration.\nFor example, it could be some JSON, XML, an integer, or a string.\n\nExamples could include:\n\n  - `123345` - An ID from your system, that helps with linkage when returning the study.\n  - `{ \\\"id\\\": \\\"45\\\", \\\"type\\\": \\\"finance\\\"}` - Some JSON that you want to store."
        credential_pool_id:
          type:
          - string
          - 'null'
          description: 'The ID of the credential pool to associate with this study. Credential pools contain

            username/password pairs that are distributed to participants when they start the study.


            When provided, participants will be assigned unique credentials from the pool. Each

            credential can only be used once and is tracked throughout the study lifecycle.


            **Note:** The credential pool must:

            - Exist and belong to the study''s workspace

            - Have available (unredeemed) credentials


            See the [Credentials endpoints](#tag/Credentials) for managing credential pools.'
        has_credentials:
          type: boolean
          description: 'Indicates whether this study requires participants to use credentials. This field is

            automatically set to `true` when a `credential_pool_id` is provided, and `false` when

            the credential pool is removed.


            **Note:** This field is automatically managed based on the `credential_pool_id` field

            and does not need to be set manually.'
        data_collection_method:
          oneOf:
          - $ref: '#/components/schemas/BaseStudyDataCollectionMethod'
          - type: 'null'
          description: '**Optional.** Specifies the data collection method for the study.


            - `AI_TASK_BUILDER_BATCH`: Use AI Task Builder for data annotation tasks.

            - `AI_TASK_BUILDER_COLLECTION`: Use AI Task Builder for data collection tasks.


            **Note:** This field is mutually exclusive with `external_study_url` and `access_details`. If not provided, you must specify one of those fields instead.'
        data_collection_id:
          type:
          - string
          - 'null'
          description: 'The ID of the data collection batch or project from the Task Builder API.


            **Required when `data_collection_method` is set to `AI_TASK_BUILDER_BATCH` or `AI_TASK_BUILDER_COLLECTION`.**'
        data_collection_metadata:
          oneOf:
          - $ref: '#/components/schemas/BaseStudyDataCollectionMetadata'
          - type: 'null'
          description: "**Optional.** Additional metadata for configuring AI Task Builder data annotation behavior. Only used when `data_collection_method` is set to `AI_TASK_BUILDER_BATCH`.\n\n**Properties:**\n\n- `annotators_per_task` (integer): Number of annotators per task. **This field must be provided if you want multiple annotators per task.** Without this field, the default value of 1 will be used.\n  - Minimum: 1\n  - Default: 1 (if not provided)\n\n**Example:**\n```json\n{\n  \"annotators_per_task\": 5\n}\n```\n\n**Important:** You must include `annotators_per_task` to control how many participants annotate each task. After the study is published, this value can only be increased (not decreased), which will increase the total available places on the study."
        access_details:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BaseStudyAccessDetailsItems'
          description: 'Array of access_details, which integrates with taskflow.


            While this field is nullable, you must provide one of `access_details` or `external_study_url`.


            The sum of all access_details must add to the `total_available_places` field, however the values can be different for an individual access_detail.'
        is_external_study_url_secure:
          type: boolean
          description: "When set to true, any query parameters in the external study url will be signed with a JSON Web Token. The token will be added to the URL as a query parameter named `prolific_token`.\n\nThis feature is only available to certain workspaces.\n\n**The JWT payload**\n\nHeader:\n\n```json\n{\n  \"alg\": \"RS256\",\n  \"kid\": \"<KEY_ID>\",\n  \"typ\": \"JWT\"\n}\n```\n\nWhere\n- alg is always RS256.\n- kid indicates the key ID that was used to secure the JWT.\n- typ is always JWT.\n\nPayload:\n\n```json\n{\n  \"iss\": \"https://www.prolific.com\",\n  \"iat\": <CURRENT_TIME>,\n  \"exp\": <CURRENT_TIME + 2 minutes>,\n  \"aud\": \"<EXTERNAL_STUDY_URL>\",\n  \"sub\": \"<SESSION_ID>\",\n  \"prolific\":{\n    \"<QUERY_1>\": \"<VALUE_1>\",\n    \"<QUERY_2>\": \"<VALUE_2>\",\n    ...\n    \"workspace_id\": \"<WORKSPACE_ID>\",\n    \"organisation_id\": \"<ORGANISATION_ID>\"\n  }\n}\n```\n\n`<ORGANISATION_ID>` appears only when the workspace is linked to an\norganisation; otherwise omit that key from `prolific`.\n\nThe `prolific` object maps each URL parameter from your\nexternal study URL template to the resolved value for that\nplaceholder (for example participant, study, and session\nidentifiers). Prolific always adds `workspace_id` (string). When the\nworkspace is linked to an organisation, `organisation_id` (string)\nis also present.\n\nFor example (the sample below includes `organisation_id`; that key\nis omitted when the workspace has no linked organisation):\n\n```json\n{\n  \"iss\": \"https://www.prolific.com\",\n  \"iat\": 1740496135,\n  \"exp\": 1740496255,\n  \"aud\": \"https://x.com?STUDY_ID=1&...\",\n  \"sub\": \"1234\",\n  \"prolific\":{\n    \"STUDY_ID\": \"abcd\",\n    \"SESSION_ID\": \"1234\",\n    \"PROLIFIC_PID\": \"xyz\",\n    \"workspace_id\": \"507f1f77bcf86cd799439011\",\n    \"organisation_id\": \"507f191e810c19729de860ea\"\n  }\n}\n```\n\n**Verify the payload**\n\nWhen you receive the JWT, you must verify the following:\n- The JWT signature is authentic by verifying it with the public key from Prolific that correlates with the KID. The public keys can be retrieved from [/.well-known/study/jwks.json](#tag/Well-Known-Endpoints/paths/~1.well-known~1study~1jwks.json/get).\n- The JWT hasn't expired, by checking the `exp` claim.\n- The `aud` claim is the correct domain for your tool.\n- The `prolific` claim matches your expected payload as set in the `external_study_url` property. It always includes `workspace_id`. When the workspace is linked to an organisation, it also includes `organisation_id` (validate both against what your integration expects)."
      title: BaseStudy
