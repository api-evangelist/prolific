          type:
          - string
          - 'null'
          format: date-time
          description: Date time when the study was published.
        publish_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Date time when the study was scheduled to be published.
        date_created:
          type: string
          format: date-time
          description: Date time when the study was created
        credential_pool_id:
          type:
          - string
          - 'null'
          description: The ID of the credential pool associated with this study, if any
        is_ready_to_publish:
          type: boolean
          description: Whether the study has all required fields completed for publishing. Does not check wallet balance or funding — only study-level field completeness.
      required:
