            This should be used when rendering the recruitment times in a GUI. For example if the limit_at is 10,

            and the predicted recruitment time is 12 hours, the display string should be "10 hours+". This

            has been done for you in the display_string field.'
      title: StudyPredictedRecruitmentTimeResponse
    StudyPredictedRecruitmentTimeRequest:
      type: object
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/StudyPredictedRecruitmentTimeRequestFiltersItems'
          description: 'List of filters to apply to the count. This parameter uses the new, simplified

            filters schema for interacting with eligibility.'
        workspace_id:
          type: string
          description: The ID of the workspace the study will be created in.
        reward:
          type: number
          format: double
          description: How much are you going to pay the participants in cents. We use the currency of the workspace
        study_type:
          $ref: '#/components/schemas/StudyPredictedRecruitmentTimeRequestStudyType'
          description: Type of study.
        total_available_places:
          type: number
          format: double
          description: How many participants are you looking to recruit
        estimated_completion_time:
          type: number
          format: double
          description: Estimated duration in minutes of the experiment or survey
        device_compatibility:
          type: array
          items:
            $ref: '#/components/schemas/StudyPredictedRecruitmentTimeRequestDeviceCompatibilityItems'
          description: 'Add all devices that participants can use.

            You can include one or more options.'
        peripheral_requirements:
          type: array
          items:
            $ref: '#/components/schemas/StudyPredictedRecruitmentTimeRequestPeripheralRequirementsItems'
          description: Add all requirements that participants have to meet.
        study_labels:
          $ref: '#/components/schemas/StudyPredictedRecruitmentTimeRequestStudyLabels'
          description: The field that the study is about to get tagged with.
