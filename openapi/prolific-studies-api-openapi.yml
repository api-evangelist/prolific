    DynamicPayment:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/DynamicPaymentAction'
          description: Use this action to set up a dynamic payment study. Only certain workspaces have access to this feature. When using this action, the actor must be "researcher".
      required:
      - action
      title: DynamicPayment
    CreateStudyDataCollectionMetadata:
      type: object
      properties:
        annotators_per_task:
          type: integer
          description: Number of annotators required per task. Required for AI Task Builder Batch studies to set multiple annotators.
      description: "**Optional.** Additional metadata for configuring AI Task Builder data annotation behavior. Only used when `data_collection_method` is set to `AI_TASK_BUILDER_BATCH`.\n\n**Properties:**\n\n- `annotators_per_task` (integer): Number of annotators per task. **This field must be provided if you want multiple annotators per task.** Without this field, the default value of 1 will be used.\n  - Minimum: 1\n  - Default: 1 (if not provided)\n\n**Example:**\n```json\n{\n  \"annotators_per_task\": 5\n}\n```\n\n**Important:** You must include `annotators_per_task` to control how many participants annotate each task. After the study is published, this value can only be increased (not decreased), which will increase the total available places on the study."
      title: CreateStudyDataCollectionMetadata
