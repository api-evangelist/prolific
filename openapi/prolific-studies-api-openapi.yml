      responses:
        '200':
          description: Return the predicted recruitment time for the study
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPredictedRecruitmentTimeResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/v1/studies/predicted-recruitment-time/:
    post:
      operationId: post-study-predicted-recruitment-time
      summary: Show Study predicted recruitment time
      description: 'Returns the predicted recruitment time for a study that has not even been saved as a draft if it was published right now, based on a machine learning model.

