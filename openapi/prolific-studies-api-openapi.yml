      title: StudyShort
    BaseStudySubmissionsConfig:
      type: object
      properties:
        max_submissions_per_participant:
          type:
          - integer
          - 'null'
          default: 1
          description: "- **1** is the default Prolific experience. This means one submission, per participant, per study. If you do\n  not specify this field, the **default is 1**.\n- **1+** turns your study into a multi-submission study, meaning a participant can create many submissions per study.\n  As noted above, your survey system will need to handle providing a\nunique experience each time the participant takes the study.\n- **-1** will allow an indefinite number of submissions from a single participant, up to `total_available_places`."
        max_concurrent_submissions:
          type:
          - integer
          - 'null'
          default: -1
          description: '- **-1** is the default value, meaning unlimited concurrent active/reserved submissions per study.

            - **1+** limits the number of concurrent active/reserved submissions a study can have at one time.'
        auto_rejection_categories:
          type: array
          items:
            $ref: '#/components/schemas/BaseStudySubmissionsConfigAutoRejectionCategoriesItems'
          default: []
          description: 'List of rejection categories that trigger automatic submission rejections.


            **Available Categories:**

            - **EXCEPTIONALLY_FAST**: Automatically reject submissions completed in an exceptionally short time


            **Important Notes:**

            - **This feature is currently in an evaluation period and can be activated for your workspace upon request.**

            - Auto-rejections only apply to submissions in "AWAITING REVIEW" status

            - Submissions with return requests will not be auto-rejected

            - Auto-rejected submissions do not count towards your rejection limit

            - Set to an empty array `[]` or omit this field to disable auto-rejection'
      description: '**Advanced**: This helps with faster data collection. Your survey system will need to handle providing a

        unique experience each time the participant takes the study.


        Configuration related to study submissions. The purpose of this field is to capture any configuration options that impact the submissions made by participants in a study.'
      title: BaseStudySubmissionsConfig
    StudyCostBreakdown:
      type: object
      properties:
        rewards:
          $ref: '#/components/schemas/AmountAndCurrency'
        fees:
          $ref: '#/components/schemas/AmountAndCurrency'
        tax:
          $ref: '#/components/schemas/AmountAndCurrency'
      title: StudyCostBreakdown
    BaseStudyFiltersItems:
      oneOf:
      - $ref: '#/components/schemas/SelectFilter'
      - $ref: '#/components/schemas/RangeFilter'
      - $ref: '#/components/schemas/CompositeFilter'
      title: BaseStudyFiltersItems
    AccessDetailProgress:
      type: object
      properties:
        external_url:
          type: string
          description: URL of the task you want to send the participant to. You can pass URL search parameters as in `external_study_url`.
        total_allocation:
          type: number
          format: double
          description: 'The base number of places set by the researcher for this URL. This is the value used to determine the study''s total available places and will match what was submitted when creating or updating the study.


            This value does not include screenout-driven capacity. For studies with custom screening (fixed screen-out reward), `allocated` may exceed `total_allocation` — use `capacity_increments` to understand why.'
        allocated:
          type: number
          format: double
          description: 'The number of participants currently allocated to this URL.


            For studies with custom screening (fixed screen-out reward), this value may exceed `total_allocation`. This occurs when participants have been screened out — each screenout adds 1 to `capacity_increments`, allowing a replacement participant to be allocated. The relationship is always: `allocated ≤ total_allocation + capacity_increments`.'
        capacity_increments:
          type: number
          format: double
          description: 'The cumulative number of additional capacity slots added to this URL by screenout events. Each time a participant is screened out, this value increases by 1, allowing a replacement participant to be allocated in their place.


            This field is read-only and system-managed — it cannot be set when creating or updating a study. It will be absent (or 0) for URLs where no screenouts have occurred.


            **Example:** If `total_allocation` is 10, `capacity_increments` is 3, and `allocated` is 11, it means 3 participants were screened out, creating 3 extra slots, and 11 participants have been allocated in total — 2 slots remain.'
      required:
      - external_url
      - total_allocation
      title: AccessDetailProgress
    CreateStudyDataCollectionMethod:
      type: string
      enum:
      - AI_TASK_BUILDER_BATCH
      - AI_TASK_BUILDER_COLLECTION
      description: '**Optional.** Specifies the data collection method for the study.


        - `AI_TASK_BUILDER_BATCH`: Use AI Task Builder for data annotation tasks.

        - `AI_TASK_BUILDER_COLLECTION`: Use AI Task Builder for data collection tasks.


        **Note:** This field is mutually exclusive with `external_study_url` and `access_details`. If not provided, you must specify one of those fields instead.'
      title: CreateStudyDataCollectionMethod
    BaseStudyCompletionCodesItemsActor:
      type: string
      enum:
