components:
  schemas:
    StudyShortStudyType:
      type: string
      enum:
      - SINGLE
      - UK_REP_SAMPLE
      - US_REP_SAMPLE
      description: Deprecated. Type of study.
      title: StudyShortStudyType
    ApiV1StudiesGetParametersState:
      type: string
      enum:
      - ACTIVE
      - PAUSED
      - UNPUBLISHED
      - PUBLISHING
      - COMPLETED
      - AWAITING REVIEW
      - UNKNOWN
      - SCHEDULED
      title: ApiV1StudiesGetParametersState
    CreateStudyCompletionCodesItems:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: "The code the participant will either enter manually at the end of your study or be redirected as part of the return URL.\n\nIf the code is null, then the participant will not be asked to submit a completion code when they return to Prolific.\nNull codes can only be provided when:\n  - The actor is \"participant\"\n  - There are no other completion codes with the \"participant\" actor\n  - The actions array is empty\n\nThe code must be unique within the study.\n"
        code_type:
          $ref: '#/components/schemas/CreateStudyCompletionCodesItemsCodeType'
          description: 'A name for your code to make it easier to understand its intention. Either use one of the predefined options or any other free text.

            '
        actions:
          type: array
          items:
            $ref: '#/components/schemas/CreateStudyCompletionCodesItemsActionsItems'
          description: 'The actions that will be completed automatically when the submission is completed with this code by the participant.


            You have the ability to use one or multiple `actions` together - it''s up to you and your desired automated journey.


            If you’re looking to keep things simple, we recommend setting the `{"action": "MANUALLY_REVIEW"}` option only, so all submissions wait for your manual approval.'
        actor:
          $ref: '#/components/schemas/CreateStudyCompletionCodesItemsActor'
          default: participant
          description: The actor that can provide this completion code.
      required:
      - code
      - code_type
      - actions
      title: CreateStudyCompletionCodesItems
    DemographicExportRequest:
      type: object
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/DemographicExportRequestFiltersItems'
          description: 'List of filters to apply to the demographic export.


            When filters are provided, the export includes both base demographic data and responses to the specified filters which were applied to the study.


            When empty, only base demographic data (age, sex, country, etc.) for all participants who took the study is exported, excluding study-specific filter responses.'
      title: DemographicExportRequest
    CompositeFilterFilterId:
      type: string
      enum:
      - and
      - or
      description: Composite filter group operator. Use `and` when every child filter must match, or `or` when at least one child filter must match.
      title: CompositeFilterFilterId
    DemographicExportHistoryResponseFiltersItems:
      oneOf:
      - $ref: '#/components/schemas/SelectFilter'
      - $ref: '#/components/schemas/RangeFilter'
      - $ref: '#/components/schemas/CompositeFilter'
      title: DemographicExportHistoryResponseFiltersItems
    BaseStudyProlificIdOption:
      type: string
      enum:
      - question
      - url_parameters
      - not_required
      description: 'Use ''question'' if you will add a question in your survey or experiment asking the participant ID


        **Recommended** Use ''url_parameters'' if your survey or experiment can retrieve and store those parameters for your analysis.


        Use ''not_required'' if you don''t need to record them.'
      title: BaseStudyProlificIdOption
    FixedScreenOut:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/FixedScreenOutAction'
          description: 'Use this action to set up a fixed screen out reward study. This feature is currently available to select workspaces only.

            - A fixed screen out reward study compensates participants with a predetermined amount when they do not qualify for the study.

            - This feature enables researchers to implement more precise participant screening while ensuring fair compensation for participants'' time.'
        fixed_screen_out_reward:
          type: integer
          description: The amount that you would like to pay for a screen-out submission (in subcurrency). This must be less that the study reward.
        slots:
          type: integer
          description: "The slots field controls how many participants can be screened out of your study before it automatically pauses.\n\n#### What are slots?\n  - Slots set a limit on screen-outs to help you budget upfront, by setting the limit to the maximum number of screen-outs you're comfortable paying for in your study.\n  - When participants don't qualify for your study, they will receive a screen-out payment.\n  - The slots limit prevents unexpected high costs created from too many screen-outs.\n  - **Example**: If you set `slots: 50`, your study will pause after 50 participants are screened out, even if you still need more qualified participants.\n\n#### How slots work\n  1. **Participants are screened out** - When they enter the completion code linked to this action. They will automatically receive the fixed screen out reward.\n  2. **Study pauses automatically** - When the number of participants screened out reaches the slots limit, and there are still unfilled places in the study, the study will automatically pause.\n  3. **You get notified** - Via email and webhook, notifying you that you’ve reached your slot limit, and that your study has been paused.  (Webhook notifications only if they’re enabled for `study.status.change` events)\n\n#### Resuming your study\n  *To continue recruiting after hitting the slot limit:*\n\n  1. **Increase the slot limit** using the [update study](#tag/Studies/operation/UpdateStudy) endpoint.\n     - Update the initial property to your new slot limit.\n     - Refer `update_slots` in the example of the [UpdateStudy](#tag/Studies/operation/UpdateStudy) endpoint.\n     - For example, if you started with 50 slots and want to add another 50 slots, set the `slots` property to 100.\n  ```json\n    {\n      \"completion_codes\": [\n        {\n          \"code\": \"ABC123\",\n          \"actions\": [\n            {\n              \"action\": \"FIXED_SCREEN_OUT_PAYMENT\",\n              \"slots\": 100\n            }\n          ]\n        }\n      ]\n    }\n  ```\n  2. **Resume the study** by transitioning it back to `START` state using the [transition study](#tag/Studies/operation/PublishStudy) endpoint.\n\n  ```json\n  {\n    \"action\": \"START\"\n  }\n  ```"
      required:
      - action
      - fixed_screen_out_reward
      - slots
      description: Use this action to set up a fixed screen out reward study.
      title: FixedScreenOut
    Studies_DeleteStudy_Response_200:
      type: object
      properties: {}
      description: Empty response body
      title: Studies_DeleteStudy_Response_200
    CreateStudySubmissionsConfig:
      type: object
      properties:
        max_submissions_per_participant:
          type:
          - integer
          - 'null'
          default: 1
          description: "- **1** is the default Prolific experience. This means one submission, per participant, per study. If you do\n  not specify this field, the **default is 1**.\n- **1+** turns your study into a multi-submission study, meaning a participant can create many submissions per study.\n  As noted above, your survey system will need to handle providing a\nunique experience each time the participant takes the study.\n- **-1** will allow an indefinite number of submissions from a single participant, up to `total_available_places`."
        max_concurrent_submissions:
          type:
          - integer
          - 'null'
          default: -1
          description: '- **-1** is the default value, meaning unlimited concurrent active/reserved submissions per study.

            - **1+** limits the number of concurrent active/reserved submissions a study can have at one time.'
        auto_rejection_categories:
          type: array
          items:
            $ref: '#/components/schemas/CreateStudySubmissionsConfigAutoRejectionCategoriesItems'
          default: []
          description: 'List of rejection categories that trigger automatic submission rejections.


            **Available Categories:**

            - **EXCEPTIONALLY_FAST**: Automatically reject submissions completed in an exceptionally short time


            **Important Notes:**

            - **This feature is currently in an evaluation period and can be activated for your workspace upon request.**

            - Auto-rejections only apply to submissions in "AWAITING REVIEW" status

            - Submissions with return requests will not be auto-rejected

            - Auto-rejected submissions do not count towards your rejection limit

            - Set to an empty array `[]` or omit this field to disable auto-rejection'
      description: '**Advanced**: This helps with faster data collection. Your survey system will need to handle providing a

        unique experience each time the participant takes the study.


        Configuration related to study submissions. The purpose of this field is to capture any configuration options that impact the submissions made by participants in a study.'
      title: CreateStudySubmissionsConfig
    StudyCostRequest:
      type: object
      properties:
        reward:
          type: number
          format: double
          description: How much are you going to pay the participants in cents. We use the currency of your account
        total_available_places:
          type: number
          format: double
          description: How many participants are you looking to recruit
      required:
      - reward
      - total_available_places
      title: StudyCostRequest
    RangeFilterWeightingsSelectedRangeLower:
