    source_operation: openapi/prolific-openapi-original.yml#create-filter-set
  - name: get_eligibility_count
    source_operation: openapi/prolific-openapi-original.yml#get-eligible-count
  - name: list_workspaces
    source_operation: openapi/prolific-openapi-original.yml#get-workspaces
  - name: list_projects
    source_operation: openapi/prolific-openapi-original.yml#get-projects
  - name: list_studies
    source_operation: openapi/prolific-openapi-original.yml#get-studies
  - name: view_study
    source_operation: openapi/prolific-openapi-original.yml#get-study
  - name: create_study
    source_operation: openapi/prolific-openapi-original.yml#create-study
  - name: publish_study
    source_operation: openapi/prolific-openapi-original.yml#publish-study
- name: prolific-docs
  description: Hosted documentation-search MCP server (fern-docs-mcp-server) over docs.prolific.com. Exposes
    a single read-only searchDocs tool for AI clients.
  transport: http
  url: https://docs.prolific.com/_mcp/server
  install: claude mcp add --transport http fern_mcp_docs-prolific-com https://docs.prolific.com/_mcp/server
  tools:
  - name: searchDocs
    description: Search docs.prolific.com; returns doc passages with source URLs (read-only).
