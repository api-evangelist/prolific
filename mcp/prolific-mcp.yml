servers:
- name: prolific
  description: Official Prolific MCP server bridging LLM agents to the Prolific public API. Built with
    FastMCP; listed on the official MCP Registry. Defaults to stdio (launched by an MCP client); supports
    streamable HTTP for local dev. Ships per-platform .mcpb bundles for Claude Desktop.
  transport: stdio
  package: prolific-mcp
  repo: https://github.com/prolific-oss/prolific-mcp
  registry: https://registry.modelcontextprotocol.io/v0/servers?search=prolific
  env:
    PROLIFIC_TOKEN: required
    PROLIFIC_URL: https://api.prolific.com
  warning: publish_study spends real money — a published study charges you as participants start it. There
    is no sandbox mode for that endpoint; treat any LLM-driven invocation as a real spend.
  tools:
  - name: get_filters
    source_operation: openapi/prolific-openapi-original.yml#get-filters
